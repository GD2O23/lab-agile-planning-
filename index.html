  function exportJSON() {
    const payload = {
      _meta: {
        source: "gsb-migration-dashboard",
        schemaVersion: 2,
        exportedAt: new Date().toISOString(),
      },
      plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle,
      cohortDefs, faqs, questions, gantt, techSpecs, techPlan,
      brImpact, brGoLive, brPiv, brTechSetup, brUat, brDefects,
      tabLabels, subTabLabels, keyDates,
    };
    const b = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const u = URL.createObjectURL(b);
    const a = document.createElement("a"); a.href=u; a.download=`gsb-migration-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(u);
  }
  function importJSON(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let s;
      try {
        s = JSON.parse(ev.target.result);
      } catch(err) {
        alert("Could not read this file — it doesn't look like valid JSON.\n\n" + err.message);
        e.target.value = "";
        return;
      }
      if (!s || typeof s !== "object" || Array.isArray(s)) {
        alert("Could not read this file — expected a Save Dashboard JSON export.");
        e.target.value = "";
        return;
      }

      // Type-checked import: only apply a field if it's the shape we expect,
      // and report anything that was present-but-invalid or missing so data
      // dropped by a lossy transfer (email/DLP/file-share sanitisation) is
      // caught immediately instead of silently disappearing.
      const imported = [];
      const skipped = [];
      function applyArray(key, setter, label) {
        if (s[key] === undefined) return;
        if (Array.isArray(s[key])) { setter(s[key]); imported.push(`${label} (${s[key].length})`); }
        else skipped.push(label);
      }
      function applyObject(key, setter, label) {
        if (s[key] === undefined) return;
        if (s[key] && typeof s[key] === "object" && !Array.isArray(s[key])) { setter(s[key]); imported.push(label); }
        else skipped.push(label);
      }
      function applyString(key, setter, label) {
        if (s[key] === undefined) return;
        if (typeof s[key] === "string") { setter(s[key]); imported.push(label); }
        else skipped.push(label);
      }

      applyArray("plan", setPlan, "Plan & Timeline");
      applyArray("risks", setRisks, "Risks & Mitigations");
      applyObject("comms", setComms, "Communication Plans");
      applyArray("milestones", setMilestones, "Milestones");
      applyString("bannerGoLive", setBannerGoLive, "Go-Live banner");
      applyString("bannerDeact", setBannerDeact, "Deactivation banner");
      applyString("bannerNote", setBannerNote, "Banner note");
      applyString("orgName", setOrgName, "Organisation name");
      applyString("dashTitle", setDashTitle, "Dashboard title");
      applyArray("cohortDefs", setCohortDefs, "Cohort definitions");
      applyArray("faqs", setFaqs, "FAQs");
      applyArray("questions", setQuestions, "Open Questions");
      applyArray("gantt", setGantt, "Project Plan");
      applyArray("techSpecs", setTechSpecs, "Technical Spec");
      applyArray("techPlan", setTechPlan, "Tech Requirements & Plan");
      applyArray("brImpact", setBrImpact, "Business Readiness — Impact Assessment");
      applyArray("brGoLive", setBrGoLive, "Business Readiness — Go-Live & Approvals");
      applyArray("brPiv", setBrPiv, "Business Readiness — PIV & Prerequisites");
      applyArray("brTechSetup", setBrTechSetup, "Business Readiness — Tech Setup");
      applyArray("brUat", setBrUat, "Business Readiness — UAT");
      applyArray("brDefects", setBrDefects, "Business Readiness — Defects");
      applyArray("tabLabels", setTabLabels, "Tab titles");
      applyObject("subTabLabels", v => setSubTabLabels(prev => ({...prev, ...v})), "Sub-tab titles");
      applyArray("keyDates", setKeyDates, "Key Dates");

      if (imported.length === 0 && skipped.length === 0) {
        alert("No recognised dashboard data found in this file.");
      } else {
        let msg = "Import complete.\n\nImported:\n" + (imported.length ? imported.map(x=>"• "+x).join("\n") : "(none)");
        if (skipped.length) msg += "\n\nSkipped — present in the file but not in the expected format, left unchanged:\n" + skipped.map(x=>"• "+x).join("\n");
        alert(msg);
      }
    };
    reader.readAsText(file); e.target.value = "";
  }

  function setPlanU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setPlan(prev => typeof fn === "function" ? fn(prev) : fn);
  }
  function setRisksU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setRisks(prev => typeof fn === "function" ? fn(prev) : fn);
  }
  function setCommsU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setComms(prev => typeof fn === "function" ? fn(prev) : fn);
  }
  function setMilestonesU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setMilestones(prev => typeof fn === "function" ? fn(prev) : fn);
  }

  function updateCohortDef(key, field, val) {
    pushUndo({plan, risks, comms, milestones});
    setCohortDefs(prev => prev.map(m => m.key===key ? {...m,[field]:val} : m));
  }
  function addCohortDef() {
    const PALETTE = ["#1d4ed8","#0891b2","#7c3aed","#0f766e","#b45309","#be123c","#15803d","#6d28d9","#0369a1","#9a3412"];
    const usedColors = cohortDefs.map(c=>c.color);
    const color = PALETTE.find(c=>!usedColors.includes(c)) || PALETTE[cohortDefs.length % PALETTE.length];
    const num = cohortDefs.length + 1;
    const key = "c" + Date.now();
    pushUndo({plan, risks, comms, milestones});
    setCohortDefs(prev => [...prev, {key, label:"Cohort "+num, color, title:"New Cohort", desc:"", objective:""}]);
    setComms(prev => ({...prev, [key]: []}));
  }
  function deleteCohortDef(key) {
    pushUndo({plan, risks, comms, milestones});
    setCohortDefs(prev => prev.filter(c=>c.key!==key));
    setComms(prev => { const next={...prev}; delete next[key]; return next; });
  }

  if (!loaded) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b",fontFamily:"'Sora',sans-serif"}}>Loading...</div>;

  if (presentationView) {
    return (
      <div style={{minHeight:"100vh",background:"#f1f5f9",fontFamily:"'Sora',sans-serif"}}>
        <div style={{background:"#0f172a",padding:"10px 24px",display:"flex",gap:8,position:"sticky",top:0,zIndex:50}} className="no-print">
          <button onClick={()=>setPresentationView(false)}
            style={{padding:"6px 14px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#e2e8f0",fontSize:11,cursor:"pointer",fontWeight:600}}>
            ← Back to Dashboard
          </button>
          <button onClick={() => window.print()}
            style={{padding:"6px 14px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>
            Print / PDF
          </button>
        </div>
        <PresentationView risks={risks} questions={questions} milestones={milestones} bannerGoLive={bannerGoLive}
          comms={comms} cohortDefs={cohortDefs} brImpact={brImpact}/>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:"#f1f5f9",fontFamily:"'Sora',sans-serif"}}>
      <div style={{background:"#0f172a",position:"sticky",top:0,zIndex:50,boxShadow:"0 2px 12px rgba(0,0,0,0.2)"}} className="no-print">
        <div style={{padding:"14px 24px 0",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:"#475569",marginBottom:2}}>{editMode ? <input value={orgName} onChange={e=>setOrgName(e.target.value)} placeholder="Organisation" style={{fontSize:9,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:"#475569",background:"transparent",border:"none",borderBottom:"1px solid rgba(255,255,255,0.3)",outline:"none",width:200,padding:"1px 0"}}/> : (orgName || null)}</div>
            <div style={{fontSize:19,fontWeight:800,color:"#f1f5f9",letterSpacing:-0.3}}>{editMode ? <input value={dashTitle} onChange={e=>setDashTitle(e.target.value)} style={{fontSize:19,fontWeight:800,color:"#f1f5f9",background:"transparent",border:"none",borderBottom:"1px solid rgba(255,255,255,0.3)",outline:"none",width:360,padding:"1px 2px",letterSpacing:-0.3,fontFamily:"inherit"}}/> : dashTitle}</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {saveStatus==="saved" && <span style={{fontSize:11,color:"#4ade80",fontWeight:600}}>✓ Saved</span>}
            <label style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>
              Import <input ref={importRef} type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>
            </label>
            <button onClick={exportJSON} style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>Save Dashboard</button>
            <button onClick={() => window.print()} style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>Print / PDF</button>
            <button onClick={() => setPresentationView(true)} style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>Presentation View</button>
            {editMode && undoStack.length > 0 && (
              <button onClick={undoLast}
                style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>
                ↩ Undo ({undoStack.length})
              </button>
            )}
            {editMode && (
              <button onClick={()=>setRenamingTabs(r=>!r)}
                style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",cursor:"pointer",fontWeight:600,fontSize:11,
                  background:renamingTabs?"#6366f1":"none",color:renamingTabs?"#fff":"#94a3b8",transition:"all 0.15s"}}>
                {renamingTabs ? "✎ Renaming — Click to Finish" : "✎ Rename Tabs"}
              </button>
            )}
            <button onClick={editMode ? requestExitEdit : enterEditMode}
              style={{padding:"6px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:11,
                background:editMode?"#f59e0b":"#1e3a5f",color:editMode?"#0f172a":"#e2e8f0",transition:"all 0.15s"}}>
              {editMode ? "✎ Editing — Click to Exit" : "✎ Edit Mode"}
            </button>
          </div>
        </div>
        <div style={{display:"flex",gap:2,padding:"10px 24px 0",overflowX:"auto",overflowY:"hidden"}} className="no-print">
          {DEFAULT_TAB_LABELS.map((defaultLabel,i) => {
            const label = tabLabels[i] || defaultLabel;
            return renamingTabs ? (
              <input key={i} value={label} onChange={e=>updateTabLabel(i,e.target.value)}
                style={{padding:"9px 12px",fontWeight:tab===i?700:500,fontSize:12,
                  background:tab===i?"#f1f5f9":"transparent",color:tab===i?"#0f172a":"#94a3b8",
                  borderRadius:"8px 8px 0 0",border:"1px solid #6366f1",fontFamily:"inherit",
                  whiteSpace:"nowrap",flexShrink:0,width:Math.max(90,label.length*7+30)}}/>
            ) : (
              <button key={i} onClick={()=>setTab(i)}
                style={{padding:"9px 18px",border:"none",cursor:"pointer",fontWeight:tab===i?700:500,fontSize:12,
                  background:tab===i?"#f1f5f9":"transparent",color:tab===i?"#0f172a":"#94a3b8",
                  borderRadius:"8px 8px 0 0",transition:"all 0.15s",whiteSpace:"nowrap",flexShrink:0}}>
                {label}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{background:"#fff7ed",borderBottom:"2px solid #fdba74",padding:"8px 24px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}} className="no-print">
        <span style={{fontSize:14}}>◆</span>
        <span style={{fontSize:12,fontWeight:700,color:"#9a3412"}}>
          Go-Live: {editMode
            ? <input value={bannerGoLive} onChange={e=>{setBannerGoLive(e.target.value);pushUndo({plan,risks,comms,milestones,bannerGoLive,bannerDeact,bannerNote});}}
                style={{fontSize:12,fontWeight:700,color:"#9a3412",border:"1px solid #fdba74",borderRadius:4,padding:"1px 6px",background:"#fff7ed",width:140}}/>
            : bannerGoLive}
        </span>
        <span style={{fontSize:12,color:"#7c2d12",marginLeft:4,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          Mastercard deactivation: {editMode
            ? <input value={bannerDeact} onChange={e=>{setBannerDeact(e.target.value);pushUndo({plan,risks,comms,milestones,bannerGoLive,bannerDeact,bannerNote});}}
                style={{fontSize:12,color:"#7c2d12",border:"1px solid #fdba74",borderRadius:4,padding:"1px 6px",background:"#fff7ed",width:130}}/>
            : bannerDeact}
          {" · "}
          {editMode
            ? <input value={bannerNote} onChange={e=>{setBannerNote(e.target.value);pushUndo({plan,risks,comms,milestones,bannerGoLive,bannerDeact,bannerNote});}}
                style={{fontSize:12,color:"#7c2d12",border:"1px solid #fdba74",borderRadius:4,padding:"1px 6px",background:"#fff7ed",width:280}}/>
            : bannerNote}
        </span>
        {editMode && <span style={{fontSize:10,color:"#92400e",marginLeft:4}}>✎ click to edit</span>}
      </div>

      <div style={{padding:"20px 24px 48px"}}>
        {tab===0 && <PlanTimelineTab plan={plan} setPlan={setPlanU} milestones={milestones} setMilestones={setMilestonesU} gantt={gantt} setGantt={setGantt} editMode={editMode}
          subTabLabels={subTabLabels} updateSubTabLabel={updateSubTabLabel} renamingTabs={renamingTabs}/>}
        {tab===1 && <RisksTab data={risks} setData={setRisksU} editMode={editMode}/>}
        {tab===2 && <CommsJourneyTab comms={comms} setComms={setCommsU} cohortDefs={cohortDefs} updateCohortDef={updateCohortDef} addCohortDef={addCohortDef} deleteCohortDef={deleteCohortDef} editMode={editMode}
          subTabLabels={subTabLabels} updateSubTabLabel={updateSubTabLabel} renamingTabs={renamingTabs}
          keyDates={keyDates} setKeyDates={setKeyDates}/>}
        {tab===3 && <QuestionsTab data={questions} setData={setQuestions} editMode={editMode}/>}
        {tab===4 && <FAQsTab data={faqs} setData={setFaqs} editMode={editMode}/>}
        {tab===5 && <TechSpecPlanTab techSpecs={techSpecs} setTechSpecs={setTechSpecs} techPlan={techPlan} setTechPlan={setTechPlan} editMode={editMode}
          subTabLabels={subTabLabels} updateSubTabLabel={updateSubTabLabel} renamingTabs={renamingTabs}/>}
        {tab===6 && <BusinessReadinessTab
          br={{impact:brImpact, goLive:brGoLive, piv:brPiv, techSetup:brTechSetup, uat:brUat, defects:brDefects}}
          setBr={{impact:setBrImpact, goLive:setBrGoLive, piv:setBrPiv, techSetup:setBrTechSetup, uat:setBrUat, defects:setBrDefects}}
          editMode={editMode}
          subTabLabels={subTabLabels} updateSubTabLabel={updateSubTabLabel} renamingTabs={renamingTabs}/>}
      </div>

      {showDiscard && (
        <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.25)",overflow:"hidden"}}>
            <div style={{background:"#0f172a",padding:"18px 24px"}}>
              <div style={{fontSize:16,fontWeight:800,color:"#fff",marginBottom:4}}>Exit Edit Mode</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>Do you want to save or discard your changes?</div>
            </div>
            <div style={{padding:"20px 24px"}}>
              <div style={{fontSize:12,color:"#475569",marginBottom:20,lineHeight:1.6}}>
                Select <strong>Save Changes</strong> to keep your edits, or <strong>Discard Changes</strong> to revert everything back to how it was when you opened edit mode.
                {undoStack.length > 0 && <span style={{display:"block",marginTop:8,color:"#94a3b8"}}>{undoStack.length} undoable action{undoStack.length > 1 ? "s" : ""} will also be cleared.</span>}
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button onClick={discardAndExit}
                  style={{padding:"9px 18px",borderRadius:8,border:"1px solid #e2e8f0",background:"#f8fafc",color:"#0f172a",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                  Discard Changes
                </button>
                <button onClick={saveAndExit}
                  style={{padding:"9px 18px",borderRadius:8,border:"none",background:"#0f172a",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
      <div style={{padding:"12px 24px",borderTop:"1px solid #e2e8f0",background:"#fff",display:"flex",gap:12,flexWrap:"wrap",alignItems:"center",fontSize:11,color:"#94a3b8"}} className="no-print">
        <span>Card Migration Dashboard v2.1</span>
        <span>·</span>
        <span>Auto-saves to this browser · Use <strong>Save Dashboard</strong> to export a portable JSON backup</span>
        {editMode && <span style={{color:"#f59e0b",fontWeight:700,marginLeft:"auto"}}>Edit mode active — drag ⠿ to reorder rows</span>}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("Dashboard crashed:", error, info);
  }
  resetSavedData() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
    window.location.reload();
  }
  render() {
    if (!this.state.hasError) return this.props.children;
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
        background:"#f1f5f9",fontFamily:"'Sora',sans-serif",padding:24}}>
        <div style={{background:"#fff",borderRadius:16,padding:"32px 36px",maxWidth:520,
          boxShadow:"0 24px 64px rgba(0,0,0,0.15)",border:"1px solid #e2e8f0"}}>
          <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:18,fontWeight:800,color:"#0f172a",marginBottom:8}}>Something went wrong</div>
          <div style={{fontSize:13,color:"#475569",lineHeight:1.6,marginBottom:20}}>
            The dashboard hit an unexpected error and stopped rendering instead of showing a blank screen.
            Your saved data in this browser hasn't been touched — try reloading first. If it keeps happening
            (usually caused by a corrupted or partial import), you can reset the saved data below and start
            fresh from defaults.
          </div>
          {this.state.error && (
            <div style={{fontSize:11,fontFamily:"monospace",color:"#94a3b8",background:"#f8fafc",
              border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",marginBottom:20,
              maxHeight:120,overflow:"auto",whiteSpace:"pre-wrap"}}>
              {String((this.state.error && this.state.error.message) || this.state.error)}
            </div>
          )}
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <button onClick={() => window.location.reload()}
              style={{padding:"9px 18px",borderRadius:8,border:"none",background:"#0f172a",
                color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              Reload Page
            </button>
            <button onClick={() => this.resetSavedData()}
              style={{padding:"9px 18px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",
                color:"#9f1239",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              Reset Saved Data &amp; Reload
            </button>
          </div>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
