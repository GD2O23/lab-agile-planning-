function FAQsTab({data, setData, editMode}) {
  const [filterCat, setFilterCat] = useState("All");
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState({});

  function toggle(id) { setExpanded(prev => ({...prev, [id]: !prev[id]})); }
  function update(id, field, val) { setData(prev => prev.map(q => q.id===id ? {...q,[field]:val} : q)); }
  function addFaq() {
    const newId = "f" + Date.now();
    setData(prev => [...prev, {id:newId, category:filterCat==="All"?"Preparation":filterCat, question:"", answer:""}]);
    setExpanded(prev => ({...prev, [newId]: true}));
  }
  function delFaq(id) { setData(prev => prev.filter(q => q.id !== id)); }

  const visible = data.filter(q => {
    const catMatch = filterCat === "All" || q.category === filterCat;
    const srch = search.toLowerCase();
    const textMatch = !srch || q.question.toLowerCase().includes(srch) || q.answer.toLowerCase().includes(srch);
    return catMatch && textMatch;
  });

  const grouped = FAQ_CATEGORIES.filter(c => c !== "All").reduce((acc, cat) => {
    const items = visible.filter(q => q.category === cat);
    if (items.length) acc[cat] = items;
    return acc;
  }, {});

  const CAT_COLORS = {
    "Preparation":        {bg:"#dbeafe",text:"#1e40af",border:"#bfdbfe"},
    "Activation":         {bg:"#dcfce7",text:"#166534",border:"#bbf7d0"},
    "Fees and Payments":  {bg:"#fef3c7",text:"#92400e",border:"#fde68a"},
    "Security":           {bg:"#fee2e2",text:"#991b1b",border:"#fecaca"},
    "Managing Your Account":{bg:"#ede9fe",text:"#5b21b6",border:"#ddd6fe"},
  };

  return (
    <div>
      {/* Summary + controls */}
      <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{background:"#fff",borderRadius:10,padding:"12px 18px",
          border:"1px solid #e2e8f0",boxShadow:"0 1px 4px rgba(0,0,0,0.04)",flexShrink:0}}>
          <div style={{fontSize:22,fontWeight:800,color:"#0f172a"}}>{data.length}</div>
          <div style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:0.8}}>Total FAQs</div>
        </div>
        <input
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search questions and answers..."
          style={{flex:1,minWidth:200,padding:"9px 14px",borderRadius:8,border:"1px solid #e2e8f0",
            fontSize:12,outline:"none",fontFamily:"inherit"}}
        />
        {editMode && (
          <button onClick={addFaq}
            style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#0f172a",
              color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0}}>
            + Add FAQ
          </button>
        )}
      </div>

      {/* Category filter pills */}
      <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}} className="no-print">
        {FAQ_CATEGORIES.map(cat => {
          const cc = cat !== "All" ? CAT_COLORS[cat] : null;
          const active = filterCat === cat;
          return (
            <button key={cat} onClick={() => setFilterCat(cat)}
              style={{padding:"5px 14px",borderRadius:20,fontSize:11,fontWeight:600,
                cursor:"pointer",border:"1px solid",transition:"all 0.12s",
                borderColor: active ? (cc ? cc.border : "#0f172a") : "#e2e8f0",
                background: active ? (cc ? cc.bg : "#0f172a") : "#fff",
                color: active ? (cc ? cc.text : "#fff") : "#64748b"}}>
              {cat}
            </button>
          );
        })}
      </div>

      {/* FAQ groups */}
      {Object.keys(grouped).length === 0 && (
        <div style={{textAlign:"center",padding:"40px 20px",color:"#94a3b8",fontSize:13}}>
          No FAQs match your search.
        </div>
      )}

      {Object.entries(grouped).map(([cat, items]) => {
        const cc = CAT_COLORS[cat] || {bg:"#f8fafc",text:"#475569",border:"#e2e8f0"};
        return (
          <div key={cat} style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{fontSize:10,fontWeight:800,padding:"3px 10px",borderRadius:12,
                background:cc.bg,color:cc.text,border:`1px solid ${cc.border}`,
                textTransform:"uppercase",letterSpacing:1}}>
                {cat}
              </span>
              <span style={{fontSize:11,color:"#94a3b8"}}>{items.length} question{items.length!==1?"s":""}</span>
            </div>

            <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",
              overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
              {items.map((q, i) => {
                const isOpen = expanded[q.id];
                const isEmpty = !q.answer;
                return (
                  <div key={q.id} style={{borderBottom: i<items.length-1 ? "1px solid #f1f5f9" : "none"}}>
                    {/* Question row */}
                    <div
                      onClick={() => !editMode && toggle(q.id)}
                      style={{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 18px",
                        cursor:editMode?"default":"pointer",
                        background:isOpen?`${cc.bg}66`:"#fff",
                        transition:"background 0.12s"}}>
                      <div style={{width:20,height:20,borderRadius:"50%",
                        background:isOpen?cc.text:"#e2e8f0",flexShrink:0,marginTop:1,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        transition:"all 0.12s"}}>
                        <span style={{fontSize:10,color:isOpen?"#fff":"#94a3b8",fontWeight:700,lineHeight:1}}>
                          {isOpen?"−":"+"}
                        </span>
                      </div>
                      <div style={{flex:1}}>
                        {editMode
                          ? <textarea value={q.question}
                              onChange={e => update(q.id,"question",e.target.value)}
                              style={{width:"100%",fontSize:13,fontWeight:600,color:"#0f172a",
                                fontFamily:"inherit",border:"1px solid #6366f1",borderRadius:4,
                                padding:"4px 6px",resize:"vertical",minHeight:36,lineHeight:1.5}}/>
                          : <span style={{fontSize:13,fontWeight:600,color:"#0f172a",lineHeight:1.5}}>
                              {q.question || <span style={{color:"#94a3b8",fontStyle:"italic"}}>No question set</span>}
                            </span>}
                        {isEmpty && !editMode && (
                          <span style={{marginLeft:8,fontSize:10,color:"#f59e0b",fontWeight:600}}>Answer pending</span>
                        )}
                      </div>
                      {editMode && (
                        <button onClick={e => {e.stopPropagation();delFaq(q.id);}}
                          style={{color:"#ef4444",background:"none",border:"none",
                            cursor:"pointer",fontSize:14,flexShrink:0}}>✕</button>
                      )}
                    </div>

                    {/* Answer */}
                    {(isOpen || editMode) && (
                      <div style={{padding:"0 18px 14px 50px",background:`${cc.bg}44`}}>
                        {editMode
                          ? <textarea value={q.answer}
                              onChange={e => update(q.id,"answer",e.target.value)}
                              placeholder="Enter answer..."
                              style={{width:"100%",fontSize:12,color:"#334155",
                                fontFamily:"inherit",border:"1px solid #6366f1",borderRadius:4,
                                padding:"6px 8px",resize:"vertical",minHeight:64,lineHeight:1.6}}/>
                          : <p style={{fontSize:12,color:"#334155",lineHeight:1.7,margin:0}}>
                              {q.answer || <span style={{color:"#94a3b8",fontStyle:"italic"}}>Answer to be confirmed.</span>}
                            </p>}
                        {editMode && (
                          <div style={{marginTop:6}}>
                            <select value={q.category}
                              onChange={e => update(q.id,"category",e.target.value)}
                              style={{fontSize:10,border:"1px solid #e2e8f0",borderRadius:6,
                                padding:"3px 8px",background:"#fff",color:"#475569",cursor:"pointer"}}>
                              {FAQ_CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}
                            </select>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      <div style={{marginTop:12,fontSize:11,color:"#94a3b8"}}>
        Click any question to expand the answer. Use the category filters or search to find specific topics.
        {data.filter(q=>!q.answer).length > 0 &&
          <span style={{color:"#f59e0b",marginLeft:8,fontWeight:600}}>
            {data.filter(q=>!q.answer).length} answer{data.filter(q=>!q.answer).length!==1?"s":""} still pending.
          </span>}
      </div>
    </div>
  );
}



function App() {
  const [tab, setTab] = useState(0);
  const [editMode, setEditMode] = useState(false);
  const [plan, setPlan] = useState(DEFAULT_PLAN);
  const [risks, setRisks] = useState(DEFAULT_RISKS);
  const [comms, setComms] = useState(DEFAULT_COMMS);
  const [milestones, setMilestones] = useState(DEFAULT_MILESTONES);
  const [saveStatus, setSaveStatus] = useState("idle");
  const [loaded, setLoaded] = useState(false);
  const [questions, setQuestions] = useState(DEFAULT_QUESTIONS);
  const [gantt, setGantt] = useState(DEFAULT_GANTT);
  const [ganttTemplate, setGanttTemplate] = useState(DEFAULT_GANTT_TEMPLATE);
  const [techSpecs, setTechSpecs] = useState(DEFAULT_TECH_SPECS);
  const [faqs, setFaqs] = useState(DEFAULT_FAQS);
  const [cohortDefs, setCohortDefs] = useState(DEFAULT_COHORT_DEFS);
  const [orgName, setOrgName] = useState("");
  const [dashTitle, setDashTitle] = useState("Mastercard → Visa Dashboard");
  const [bannerGoLive, setBannerGoLive] = useState("28 October 2026");
  const [bannerDeact, setBannerDeact] = useState("27 October 2026");
  const [bannerNote, setBannerNote] = useState("Cut-over ");
  const [showDiscard, setShowDiscard] = useState(false);
  const [editSnapshot, setEditSnapshot] = useState(null);
  const [undoStack, setUndoStack] = useState([]);
  const importRef = useRef();
  const UNDO_LIMIT = 15;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.plan) setPlan(s.plan);
        if (s.risks) setRisks(s.risks);
        if (s.comms) setComms(prev => ({...prev, ...s.comms}));
        if (s.milestones) setMilestones(s.milestones);
        if (s.bannerGoLive) setBannerGoLive(s.bannerGoLive);
        if (s.cohortDefs) setCohortDefs(s.cohortDefs);
        if (s.orgName !== undefined) setOrgName(s.orgName);
        if (s.dashTitle) setDashTitle(s.dashTitle);
        if (s.bannerDeact) setBannerDeact(s.bannerDeact);
        if (s.bannerNote) setBannerNote(s.bannerNote);
        if (s.questions) setQuestions(s.questions);
        if (s.gantt) setGantt(s.gantt);
        if (s.ganttTemplate) setGanttTemplate(s.ganttTemplate);
        if (s.techSpecs) setTechSpecs(s.techSpecs);
        if (s.faqs) setFaqs(s.faqs);
      }
    } catch(_) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, ganttTemplate, techSpecs}));
      setSaveStatus("saved");
      const t = setTimeout(() => setSaveStatus("idle"), 1800);
      return () => clearTimeout(t);
    } catch(_) {}
  }, [plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, ganttTemplate, techSpecs, loaded]);

  function pushUndo(snapshot) {
    setUndoStack(prev => {
      const next = [{...snapshot}, ...prev];
      return next.slice(0, UNDO_LIMIT);
    });
  }
  function undoLast() {
    setUndoStack(prev => {
      if (prev.length === 0) return prev;
      const [top, ...rest] = prev;
      if (top.plan) setPlan(top.plan);
      if (top.risks) setRisks(top.risks);
      if (top.comms) setComms(top.comms);
      if (top.milestones) setMilestones(top.milestones);
      return rest;
    });
  }
  function enterEditMode() {
    setEditSnapshot({plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, ganttTemplate, techSpecs});
    setUndoStack([]);
    setEditMode(true);
  }
  function requestExitEdit() {
    setShowDiscard(true);
  }
  function saveAndExit() {
    setShowDiscard(false);
    setEditSnapshot(null);
    setUndoStack([]);
    setEditMode(false);
  }
  function discardAndExit() {
    if (editSnapshot) {
      setPlan(editSnapshot.plan);
      setRisks(editSnapshot.risks);
      setComms(editSnapshot.comms);
      setMilestones(editSnapshot.milestones);
      if (editSnapshot.bannerGoLive) setBannerGoLive(editSnapshot.bannerGoLive);
      if (editSnapshot.cohortDefs) setCohortDefs(editSnapshot.cohortDefs);
      if (editSnapshot.orgName !== undefined) setOrgName(editSnapshot.orgName);
      if (editSnapshot.faqs) setFaqs(editSnapshot.faqs);
      if (editSnapshot.dashTitle) setDashTitle(editSnapshot.dashTitle);
      if (editSnapshot.bannerDeact) setBannerDeact(editSnapshot.bannerDeact);
      if (editSnapshot.bannerNote) setBannerNote(editSnapshot.bannerNote);
    }
    setShowDiscard(false);
    setEditSnapshot(null);
    setUndoStack([]);
    setEditMode(false);
  }

  function exportJSON() {
    const b = new Blob([JSON.stringify({plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, ganttTemplate, techSpecs},null,2)],{type:"application/json"});
    const u = URL.createObjectURL(b);
    const a = document.createElement("a"); a.href=u; a.download=`gsb-migration-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(u);
  }
  function importJSON(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const s = JSON.parse(ev.target.result);
        if (s.plan) setPlan(s.plan);
        if (s.risks) setRisks(s.risks);
        if (s.comms) setComms(s.comms);
        if (s.milestones) setMilestones(s.milestones);
        if (s.bannerGoLive) setBannerGoLive(s.bannerGoLive);
        if (s.bannerDeact) setBannerDeact(s.bannerDeact);
        if (s.bannerNote) setBannerNote(s.bannerNote);
        if (s.orgName !== undefined) setOrgName(s.orgName);
        if (s.dashTitle) setDashTitle(s.dashTitle);
        if (s.cohortDefs) setCohortDefs(s.cohortDefs);
        if (s.faqs) setFaqs(s.faqs);
        if (s.questions) setQuestions(s.questions);
        if (s.gantt) setGantt(s.gantt);
        if (s.ganttTemplate) setGanttTemplate(s.ganttTemplate);
        if (s.techSpecs) setTechSpecs(s.techSpecs);
      } catch(_) { alert("Could not read file."); }
    };
    reader.readAsText(file); e.target.value = "";
  }

  function setPlanU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setPlan(prev => typeof fn === "function" ? fn(prev) : fn);
  }
  function setRisksU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setRisks(prev => typeof fn === "function" ? fn(prev) : fn);
  }
  function setCommsU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setComms(prev => typeof fn === "function" ? fn(prev) : fn);
  }
  function setMilestonesU(fn) {
    pushUndo({plan, risks, comms, milestones});
    setMilestones(prev => typeof fn === "function" ? fn(prev) : fn);
  }

  function updateCohortDef(key, field, val) {
    pushUndo({plan, risks, comms, milestones});
    setCohortDefs(prev => prev.map(m => m.key===key ? {...m,[field]:val} : m));
  }
  function addCohortDef() {
    const PALETTE = ["#1d4ed8","#0891b2","#7c3aed","#0f766e","#b45309","#be123c","#15803d","#6d28d9","#0369a1","#9a3412"];
    const usedColors = cohortDefs.map(c=>c.color);
    const color = PALETTE.find(c=>!usedColors.includes(c)) || PALETTE[cohortDefs.length % PALETTE.length];
    const num = cohortDefs.length + 1;
    const key = "c" + Date.now();
    pushUndo({plan, risks, comms, milestones});
    setCohortDefs(prev => [...prev, {key, label:"Cohort "+num, color, title:"New Cohort", desc:"", objective:""}]);
    setComms(prev => ({...prev, [key]: []}));
  }
  function deleteCohortDef(key) {
    pushUndo({plan, risks, comms, milestones});
    setCohortDefs(prev => prev.filter(c=>c.key!==key));
    setComms(prev => { const next={...prev}; delete next[key]; return next; });
  }

  const TABS = ["Plan & Timeline","Risks & Mitigations","Communication Plans","Customer Journeys","Open Questions","Project Plan","FAQs","Project Plan Template","Technical Spec"];
  if (!loaded) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b",fontFamily:"'Sora',sans-serif"}}>Loading...</div>;

  return (
    <div style={{minHeight:"100vh",background:"#f1f5f9",fontFamily:"'Sora',sans-serif"}}>
      <div style={{background:"#0f172a",position:"sticky",top:0,zIndex:50,boxShadow:"0 2px 12px rgba(0,0,0,0.2)"}} className="no-print">
        <div style={{padding:"14px 24px 0",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:"#475569",marginBottom:2}}>{editMode ? <input value={orgName} onChange={e=>setOrgName(e.target.value)} placeholder="Organisation" style={{fontSize:9,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:"#475569",background:"transparent",border:"none",borderBottom:"1px solid rgba(255,255,255,0.3)",outline:"none",width:200,padding:"1px 0"}}/> : (orgName || null)}</div>
            <div style={{fontSize:19,fontWeight:800,color:"#f1f5f9",letterSpacing:-0.3}}>{editMode ? <input value={dashTitle} onChange={e=>setDashTitle(e.target.value)} style={{fontSize:19,fontWeight:800,color:"#f1f5f9",background:"transparent",border:"none",borderBottom:"1px solid rgba(255,255,255,0.3)",outline:"none",width:360,padding:"1px 2px",letterSpacing:-0.3,fontFamily:"inherit"}}/> : dashTitle}</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {saveStatus==="saved" && <span style={{fontSize:11,color:"#4ade80",fontWeight:600}}>✓ Saved</span>}
            <label style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>
              Import <input ref={importRef} type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>
            </label>
            <button onClick={exportJSON} style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>Save Dashboard</button>
            <button onClick={() => window.print()} style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>Print / PDF</button>
            {editMode && undoStack.length > 0 && (
              <button onClick={undoLast}
                style={{padding:"6px 11px",borderRadius:8,border:"1px solid #334155",background:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:600}}>
                ↩ Undo ({undoStack.length})
              </button>
            )}
            <button onClick={editMode ? requestExitEdit : enterEditMode}
              style={{padding:"6px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:11,
                background:editMode?"#f59e0b":"#1e3a5f",color:editMode?"#0f172a":"#e2e8f0",transition:"all 0.15s"}}>
              {editMode ? "✎ Editing — Click to Exit" : "✎ Edit Mode"}
            </button>
          </div>
        </div>
        <div style={{display:"flex",gap:2,padding:"10px 24px 0"}}>
          {TABS.map((t,i) => (
            <button key={t} onClick={()=>setTab(i)}
              style={{padding:"9px 18px",border:"none",cursor:"pointer",fontWeight:tab===i?700:500,fontSize:12,
                background:tab===i?"#f1f5f9":"transparent",color:tab===i?"#0f172a":"#94a3b8",
                borderRadius:"8px 8px 0 0",transition:"all 0.15s"}}>
              {t}
            </button>
          ))}
        </div>
      </div>

      <div style={{background:"#fff7ed",borderBottom:"2px solid #fdba74",padding:"8px 24px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}} className="no-print">
        <span style={{fontSize:14}}>◆</span>
        <span style={{fontSize:12,fontWeight:700,color:"#9a3412"}}>
          Go-Live: {editMode
            ? <input value={bannerGoLive} onChange={e=>{setBannerGoLive(e.target.value);pushUndo({plan,risks,comms,milestones,bannerGoLive,bannerDeact,bannerNote});}}
                style={{fontSize:12,fontWeight:700,color:"#9a3412",border:"1px solid #fdba74",borderRadius:4,padding:"1px 6px",background:"#fff7ed",width:140}}/>
            : bannerGoLive}
        </span>
        <span style={{fontSize:12,color:"#7c2d12",marginLeft:4,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          Mastercard deactivation: {editMode
            ? <input value={bannerDeact} onChange={e=>{setBannerDeact(e.target.value);pushUndo({plan,risks,comms,milestones,bannerGoLive,bannerDeact,bannerNote});}}
                style={{fontSize:12,color:"#7c2d12",border:"1px solid #fdba74",borderRadius:4,padding:"1px 6px",background:"#fff7ed",width:130}}/>
            : bannerDeact}
          {" · "}
          {editMode
            ? <input value={bannerNote} onChange={e=>{setBannerNote(e.target.value);pushUndo({plan,risks,comms,milestones,bannerGoLive,bannerDeact,bannerNote});}}
                style={{fontSize:12,color:"#7c2d12",border:"1px solid #fdba74",borderRadius:4,padding:"1px 6px",background:"#fff7ed",width:280}}/>
            : bannerNote}
        </span>
        {editMode && <span style={{fontSize:10,color:"#92400e",marginLeft:4}}>✎ click to edit</span>}
      </div>

      <div style={{padding:"20px 24px 48px"}}>
        {tab===0 && <PlanTab data={plan} setData={setPlanU} milestones={milestones} setMilestones={setMilestonesU} editMode={editMode}/>}
        {tab===1 && <RisksTab data={risks} setData={setRisksU} editMode={editMode}/>}
        {tab===2 && <CommsTab data={comms} setData={setCommsU} cohortDefs={cohortDefs} updateCohortDef={updateCohortDef} addCohortDef={addCohortDef} deleteCohortDef={deleteCohortDef} editMode={editMode}/>}
        {tab===3 && <JourneyTab commsData={comms} setCommsData={setCommsU} cohortDefs={cohortDefs} cohortsRef={cohortDefs} editMode={editMode}/>}
        {tab===4 && <QuestionsTab data={questions} setData={setQuestions} editMode={editMode}/>}
        {tab===5 && <GanttTab data={gantt} setData={setGantt} editMode={editMode}/>}
        {tab===6 && <FAQsTab data={faqs} setData={setFaqs} editMode={editMode}/>}
        {tab===7 && <GanttTab data={ganttTemplate} setData={setGanttTemplate} editMode={editMode}
          wsColors={TEMPLATE_WS_COLORS}
          footerNote="Blank project plan template — add your own milestones and tasks, or upload an Excel plan to get started"
          csvName="project-plan-template.csv"/>}
        {tab===8 && <TechSpecTab data={techSpecs} setData={setTechSpecs} editMode={editMode}/>}
      </div>

      {showDiscard && (
        <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.25)",overflow:"hidden"}}>
            <div style={{background:"#0f172a",padding:"18px 24px"}}>
              <div style={{fontSize:16,fontWeight:800,color:"#fff",marginBottom:4}}>Exit Edit Mode</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>Do you want to save or discard your changes?</div>
            </div>
            <div style={{padding:"20px 24px"}}>
              <div style={{fontSize:12,color:"#475569",marginBottom:20,lineHeight:1.6}}>
                Select <strong>Save Changes</strong> to keep your edits, or <strong>Discard Changes</strong> to revert everything back to how it was when you opened edit mode.
                {undoStack.length > 0 && <span style={{display:"block",marginTop:8,color:"#94a3b8"}}>{undoStack.length} undoable action{undoStack.length > 1 ? "s" : ""} will also be cleared.</span>}
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button onClick={discardAndExit}
                  style={{padding:"9px 18px",borderRadius:8,border:"1px solid #e2e8f0",background:"#f8fafc",color:"#0f172a",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                  Discard Changes
                </button>
                <button onClick={saveAndExit}
                  style={{padding:"9px 18px",borderRadius:8,border:"none",background:"#0f172a",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
      <div style={{padding:"12px 24px",borderTop:"1px solid #e2e8f0",background:"#fff",display:"flex",gap:12,flexWrap:"wrap",alignItems:"center",fontSize:11,color:"#94a3b8"}} className="no-print">
        <span>Card Migration Dashboard v2.1</span>
        <span>·</span>
        <span>Auto-saves to this browser · Use <strong>Save Dashboard</strong> to export a portable JSON backup</span>
        {editMode && <span style={{color:"#f59e0b",fontWeight:700,marginLeft:"auto"}}>Edit mode active — drag ⠿ to reorder rows</span>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
