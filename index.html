function InlineEdit({value, onChange, multiline, options, style={}}) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value);
  const ref = useRef();
  useEffect(() => { setDraft(value); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);
  function commit() { setEditing(false); if (draft !== value) onChange(draft); }
  if (options) return (
    <select value={value} onChange={e => onChange(e.target.value)}
      style={{fontSize:11,border:"1px solid #E8D8FF",borderRadius:4,padding:"2px 4px",background:"#FFFFFF",cursor:"pointer",maxWidth:"100%",...style}}>
      {options.map(o => <option key={o}>{o}</option>)}
    </select>
  );
  if (!editing) return (
    <span onClick={() => setEditing(true)} title="Click to edit"
      style={{cursor:"text",display:"inline-block",minWidth:40,borderBottom:"1px dashed #C4A0E8",lineHeight:1.5,...style}}>
      {value || <span style={{color:"#94a3b8",fontStyle:"italic"}}>—</span>}
    </span>
  );
  if (multiline) return <textarea ref={ref} value={draft} onChange={e => setDraft(e.target.value)} onBlur={commit}
    style={{width:"100%",minHeight:52,fontSize:11,fontFamily:"inherit",border:"1px solid #6366f1",borderRadius:4,padding:4,resize:"vertical",...style}}/>;
  return <input ref={ref} value={draft} onChange={e => setDraft(e.target.value)} onBlur={commit}
    onKeyDown={e => e.key === "Enter" && commit()}
    style={{width:"100%",fontSize:11,fontFamily:"inherit",border:"1px solid #6366f1",borderRadius:4,padding:"2px 4px",...style}}/>;
}

function iconForValue(value, customIcon) {
  if (value === "custom") return customIcon || "\u25CF";
  const found = JOURNEY_ICON_OPTIONS.find(o => o.value === value);
  return found ? found.icon : "";
}

function getIcon(row) {
  const chosen = iconForValue(row && row.icon, row && row.customIcon);
  if (chosen) return chosen;
  const channel = row ? row.channel : "";
  if (!channel) return "\uD83D\uDCCB";
  const ch = channel.toLowerCase();
  if (ch.includes("email") && ch.includes("app")) return "\uD83D\uDCF1 \u2709";
  if (ch.includes("app") && ch.includes("sms")) return "\uD83D\uDCF1\uD83D\uDCAC";
  if (ch.includes("email") && ch.includes("sms")) return "\u2709 \uD83D\uDCAC";
  if (ch.includes("email")) return "\u2709";
  if (ch.includes("sms")) return "\uD83D\uDCAC";
  if (ch.includes("mail") && !ch.includes("email")) return "\uD83D\uDCEC";
  if (ch.includes("app")) return "\uD83D\uDCF1";
  if (ch.includes("card") || ch.includes("plastic")) return "\uD83D\uDCB3";
  return "\uD83D\uDCCB";
}

function toCSV(rows, cols) {
  const esc = v => `"${String(v||"").replace(/"/g,'""')}"`;
  return [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c]||"")).join(","))].join("\n");
}
function downloadCSV(name, csv) {
  const b = new Blob([csv], {type:"text/csv"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}

// ── Drag-to-reorder hook ──────────────────────────────────────────────────────
function useDraggableRows(rows, setRows, editMode) {
  const dragIdx = useRef(null);
  const handlers = useCallback((idx) => {
    if (!editMode) return {};
    return {
      draggable: true,
      onDragStart: (e) => { dragIdx.current = idx; e.dataTransfer.effectAllowed = "move"; },
      onDragOver:  (e) => { e.preventDefault(); e.currentTarget.classList.add("drag-over"); },
      onDragLeave: (e) => { e.currentTarget.classList.remove("drag-over"); },
      onDrop: (e) => {
        e.currentTarget.classList.remove("drag-over");
        const from = dragIdx.current;
        const to = idx;
        if (from === null || from === to) return;
        setRows(prev => {
          const next = [...prev];
          const [moved] = next.splice(from, 1);
          next.splice(to, 0, moved);
          return next;
        });
        dragIdx.current = null;
      },
      onDragEnd: () => { dragIdx.current = null; },
    };
  }, [editMode, setRows]);
  return handlers;
}

function CommsTab({data, setData, cohortDefs, updateCohortDef, addCohortDef, deleteCohortDef, editMode}) {
  function setRows(key) { return fn => setData(prev => ({...prev, [key]: typeof fn==="function" ? fn(prev[key]) : fn})); }
  const PALETTE = ["#1d4ed8","#0891b2","#7c3aed","#0f766e","#b45309","#be123c","#15803d","#6d28d9","#0369a1","#9a3412"];
  return (
    <div>
      {editMode && (
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}} className="no-print">
          <button onClick={addCohortDef}
            style={{padding:"7px 16px",borderRadius:8,border:"none",background:"#0f172a",
              color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            + Add Cohort
          </button>
        </div>
      )}
      {(cohortDefs||[]).map(c => (
        <CommsSection key={c.key} cohort={c} meta={c}
          updateMeta={(field,val)=>updateCohortDef(c.key,field,val)}
          rows={data[c.key]||[]} setRows={setRows(c.key)} editMode={editMode}
          onDelete={()=>deleteCohortDef(c.key)}
          palette={PALETTE}
          onColorChange={(color)=>updateCohortDef(c.key,"color",color)}/>
      ))}
    </div>
  );
}

function JourneyTab({commsData, setCommsData, cohortDefs, cohortsRef, editMode, keyDates, setKeyDates}) {
  const [selectedCohort, setSelectedCohort] = useState("all");
  const [hoveredNode, setHoveredNode] = useState(null);

  function updateKeyDate(id, field, val) { setKeyDates(prev => prev.map(kd => kd.id===id ? {...kd,[field]:val} : kd)); }
  function addKeyDate() {
    const PALETTE = ["#3b82f6","#8b5cf6","#f59e0b","#f97316","#ef4444","#16a34a","#dc2626","#991b1b","#0891b2","#7c3aed"];
    setKeyDates(prev => [...prev, {id:mkId(), label:"New Date", date:"", color:PALETTE[prev.length % PALETTE.length]}]);
  }
  function delKeyDate(id) { setKeyDates(prev => prev.filter(kd => kd.id !== id)); }

  const cohorts = cohortsRef;
  const visibleCohorts = selectedCohort === "all"
    ? cohorts
    : cohorts.filter(c => c.key === selectedCohort);

  function updateJourneyRow(cohortKey, id, field, value) {
    setCommsData(prev => ({
      ...prev,
      [cohortKey]: (prev[cohortKey] || []).map(r => r.id===id ? {...r,[field]:value} : r)
    }));
  }

  function addJourneyRow(cohortKey) {
    setCommsData(prev => ({
      ...prev,
      [cohortKey]: [
        ...(prev[cohortKey] || []),
        {id:mkId(),date:"",stage:"Awareness",communication:"",channel:"",owner:"",status:"Planned",icon:""}
      ]
    }));
    if (selectedCohort === "all") setSelectedCohort(cohortKey);
  }

  function copyJourneyRow(cohortKey, row) {
    setCommsData(prev => ({
      ...prev,
      [cohortKey]: [...(prev[cohortKey] || []), {...row,id:mkId()}]
    }));
  }

  function deleteJourneyRow(cohortKey, id) {
    setCommsData(prev => ({
      ...prev,
      [cohortKey]: (prev[cohortKey] || []).filter(r => r.id!==id)
    }));
  }

  function moveJourneyRow(cohortKey, idx, dir) {
    setCommsData(prev => {
      const rows = [...(prev[cohortKey] || [])];
      const target = idx + dir;
      if (target < 0 || target >= rows.length) return prev;
      [rows[idx], rows[target]] = [rows[target], rows[idx]];
      return {...prev,[cohortKey]:rows};
    });
  }

  function stagePill(stage) {
    const sc = STAGE_COLORS[stage] || {bg:"#f1f5f9",text:"#475569",dot:"#94a3b8"};

      <span style={{fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:10,
        background:sc.bg,color:sc.text,whiteSpace:"nowrap",letterSpacing:0.3}}>
        {stage}
      </span>
    );
  }

  const nodeId = (cohortKey, idx) => cohortKey + "_" + idx;

  return (
    <div style={{fontFamily:"inherit"}}>

      {/* Header */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:13,color:"#64748b",marginBottom:12,lineHeight:1.6}}>
          Each row shows the communication journey for a customer cohort, from first contact through to post-activation follow-up.
          Touchpoints are arranged in sequence. Hover over any node for detail.

              <button key={c.key} onClick={()=>setSelectedCohort(c.key)}

                  color:selectedCohort===c.key?"#fff":c.color}}>
                {c.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* Key date legend bar */}
      <div style={{background:"#0f172a",borderRadius:"10px 10px 0 0",padding:"10px 20px",
        display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>

            <div style={{width:8,height:8,borderRadius:"50%",background:kd.color,flexShrink:0}}/>

function QuestionsTab({data, setData, editMode}) {
  function update(id, field, val) { setData(prev => prev.map(q => q.id===id ? {...q,[field]:val} : q)); }

  const resolved = data.filter(q => q.status==="resolved").length;

            <div style={{fontSize:11,color:c.color,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8}}>{c.label}</div>

        ))}
      </div>

      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:12}} className="no-print">
        <button onClick={() => downloadCSV("open-questions.csv",toCSV(data,["status","text"]))}
          style={{padding:"6px 12px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>Export CSV</button>

function parseDate(str) {
  if (!str) return null;
  const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const parts = str.trim().split(" ");
  if (parts.length < 3) return null;
  const day = parseInt(parts[0]);
  const mon = months[parts[1]];
  const yr = parseInt(parts[2]);
  if (isNaN(day) || mon === undefined || isNaN(yr)) return null;
  return new Date(yr, mon, day);
}

                        <span style={{fontSize:9,color:sc,fontWeight:600}}>{t.status}</span>
                        {t.finish && <span style={{fontSize:9,color:"#94a3b8"}}>· ends {t.finish}</span>}
                      </div>
                    </div>
                    <button onClick={()=>removeDep(t.id)}
                      style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",
                        fontSize:14,flexShrink:0,padding:"0 2px"}}>✕</button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Right: available tasks to add */}
          <div style={{display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"10px 14px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",
              fontSize:10,fontWeight:700,color:"#0f172a",letterSpacing:1,textTransform:"uppercase"}}>
              Available Tasks ({available.length})
              <div style={{fontSize:9,color:"#94a3b8",fontWeight:400,marginTop:2,textTransform:"none",letterSpacing:0}}>
                Click + to add as a dependency
              </div>
            </div>
            <div style={{overflowY:"auto",flex:1,padding:8}}>
              {available.map(t => {
                const sc = statusColor(t);
                const wc = wsColors[t.workstream]||"#374151";
                return (
                  <div key={t.id} style={{display:"flex",alignItems:"flex-start",gap:8,
                    padding:"7px 10px",borderRadius:8,border:"1px solid #f1f5f9",
                    marginBottom:4,background:"#fafafa",cursor:"pointer"}}
                    onClick={()=>addDep(t.id)}
                    onMouseEnter={e=>e.currentTarget.style.background="#f0fdf4"}
                    onMouseLeave={e=>e.currentTarget.style.background="#fafafa"}>
                    <div style={{width:3,borderRadius:2,alignSelf:"stretch",background:wc,flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11,color:"#334155",lineHeight:1.4,
                        overflow:"hidden",textOverflow:"ellipsis"}}>{t.task}</div>
                      <div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>{t.milestone}</div>
                    </div>
                    <div style={{color:"#22c55e",fontWeight:700,fontSize:16,flexShrink:0,
                      lineHeight:1,marginTop:1}}>+</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{padding:"12px 16px",borderTop:"1px solid #e2e8f0",
          display:"flex",gap:8,justifyContent:"flex-end",flexShrink:0,background:"#f8fafc"}}>
          <button onClick={onClose}
            style={{padding:"8px 16px",borderRadius:8,border:"1px solid #e2e8f0",
              background:"#fff",color:"#64748b",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            Cancel
          </button>
          <button onClick={()=>{onSave(task.id,deps);onClose();}}
            style={{padding:"8px 16px",borderRadius:8,border:"none",
              background:"#0f172a",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            Save Dependencies
          </button>
        </div>
      </div>
    </div>
  );
}

function GanttTab({data, setData, editMode}) {
  const wsColors = GANTT_WS_COLORS;
  const footerNote = "Sourced from OPP-04569 GSBB+ and Integrated Project Plan 01/06/26";
  const csvName = "project-plan.csv";
  const [filterWS, setFilterWS] = useState("All");
  const [filterMS, setFilterMS] = useState("All");
  const [viewMode, setViewMode] = useState("gantt");
  const [depTask, setDepTask] = useState(null);
  const [showDeps, setShowDeps] = useState(true);
  const [highlightId, setHighlightId] = useState(null);
  const uploadRef = useRef();
  const ganttRef = useRef();
  const rowRefs = useRef({});

  const milestones = [...new Set(data.map(r=>r.milestone))];
  const workstreams = [...new Set(data.map(r=>r.workstream))];

  let visible = data;
  if (filterWS !== "All") visible = visible.filter(r=>r.workstream===filterWS);
  if (filterMS !== "All") visible = visible.filter(r=>r.milestone===filterMS);

  // Date range
  const allDates = data.flatMap(r=>[parseDate(r.start),parseDate(r.finish)]).filter(Boolean);
  const minDate = allDates.length ? new Date(Math.min(...allDates)) : new Date("2026-03-01");
  const maxDate = allDates.length ? new Date(Math.max(...allDates)) : new Date("2027-06-01");
  const totalDays = Math.max(1,(maxDate-minDate)/86400000)+14;

  function datePct(str) {
    const d = parseDate(str);
    if (!d) return 0;
    return Math.max(0,Math.min(100,((d-minDate)/86400000/totalDays)*100));
  }
  function durationPct(start,finish) {
    const s = parseDate(start), f = parseDate(finish);
    if (!s||!f) return 0.5;
    return Math.max(0.5,((f-s)/86400000/totalDays)*100);
  }

  function update(id,field,val) { setData(prev=>prev.map(r=>r.id===id?{...r,[field]:val}:r)); }
  function saveDeps(id,deps) { setData(prev=>prev.map(r=>r.id===id?{...r,deps}:r)); }

  function addRow() {
    const targetMS = filterMS !== "All" ? filterMS : milestones[milestones.length-1] || "New Milestone";
    const newRow = {id:"g"+Date.now(),milestone:targetMS,task:"New Task",
      workstream:workstreams[0]||Object.keys(wsColors)[0]||"",start:"",finish:"",
      owner:"",pct:0,status:"Planned",deps:[]};
    setData(prev => {
      const next = [...prev];
      const lastIdx = next.map(r=>r.milestone).lastIndexOf(targetMS);
      if (lastIdx >= 0) next.splice(lastIdx+1,0,newRow);
      else next.push(newRow);
      return next;
    });
  }

  function delRow(id) { setData(prev=>prev.filter(r=>r.id!==id)); }

  function moveRow(idx,dir) {
    setData(prev=>{
      const next=[...prev];
      const target=idx+dir;
      if(target<0||target>=next.length) return next;
      [next[idx],next[target]]=[next[target],next[idx]];
      return next;
    });
  }

  // Drag to reorder
  const dragIdx = useRef(null);
  function dragHandlers(idx) {
    if (!editMode) return {};
    return {
      draggable:true,
      onDragStart:(e)=>{dragIdx.current=idx;e.dataTransfer.effectAllowed="move";},
      onDragOver:(e)=>{e.preventDefault();e.currentTarget.classList.add("drag-over");},
      onDragLeave:(e)=>{e.currentTarget.classList.remove("drag-over");},
      onDrop:(e)=>{
        e.currentTarget.classList.remove("drag-over");
        const from=dragIdx.current, to=idx;
        if(from===null||from===to) return;
        setData(prev=>{
          const next=[...prev];
          const [moved]=next.splice(from,1);
          next.splice(to,0,moved);
          return next;
        });
        dragIdx.current=null;
      },
      onDragEnd:()=>{dragIdx.current=null;},
    };
  }

  function handleUpload(e) {
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const wb=XLSX.read(ev.target.result,{type:"binary"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
        if(!rows.length){alert("No data found.");return;}
        const headers=Object.keys(rows[0]);
        const colMap={};
        const targets={
          milestone:["milestone","phase","group"],
          task:["task","task name","activity","name"],
          workstream:["workstream","stream","category","type"],
          start:["start","start date"],
          finish:["finish","finish date","end","end date"],
          owner:["owner","resource","resource names","assigned to"],
          pct:["% complete","pct","complete","percent","progress"],
          status:["status"]
        };
        headers.forEach(h=>{
          const hl=h.toLowerCase().trim();
          Object.entries(targets).forEach(([key,aliases])=>{
            if(!colMap[key]&&aliases.some(a=>hl===a||hl.includes(a))) colMap[key]=h;
          });
        });
        const mapped=rows.map((r,i)=>({
          id:"xu"+i,
          milestone:String(r[colMap.milestone]||""),
          task:String(r[colMap.task]||""),
          workstream:String(r[colMap.workstream]||Object.keys(wsColors)[0]||""),
          start:String(r[colMap.start]||""),
          finish:String(r[colMap.finish]||""),
          owner:String(r[colMap.owner]||""),
          pct:parseInt(r[colMap.pct])||0,
          status:String(r[colMap.status]||"Planned"),
          deps:[],
        })).filter(r=>r.task);
        if(!mapped.length){alert("Could not map columns.");return;}
        setData(mapped);
        const matched=Object.keys(colMap).filter(k=>colMap[k]).join(", ");
        alert("Loaded "+mapped.length+" tasks. Matched: "+matched);
      } catch(err){alert("Could not read file: "+err.message);}
    };
    reader.readAsBinaryString(file);
    e.target.value="";
  }

  function exportCSV() {
    const cols=["milestone","task","workstream","start","finish","owner","pct","status","deps"];
    const esc=v=>`"${String(v||"").replace(/"/g,'""')}"`;
    const csv=[cols.join(","),...data.map(r=>cols.map(c=>esc(c==="deps"?(r.deps||[]).join(";"):r[c])).join(","))].join("\n");
    const b=new Blob([csv],{type:"text/csv"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=csvName;a.click();URL.revokeObjectURL(u);
  }

  // Stats
  const complete=data.filter(r=>r.status==="Complete").length;
  const inProgress=data.filter(r=>r.status==="In Progress").length;
  const planned=data.filter(r=>r.status==="Planned").length;
  const avgPct=data.length?Math.round(data.reduce((s,r)=>s+(r.pct||0),0)/data.length):0;

  // Highlight helpers
  function getDepsOf(id) { return (data.find(r=>r.id===id)?.deps)||[]; }
  function getDependents(id) { return data.filter(r=>(r.deps||[]).includes(id)).map(r=>r.id); }

  const thS={padding:"8px 10px",textAlign:"left",fontSize:10,fontWeight:700,letterSpacing:1.5,
    textTransform:"uppercase",color:"#94a3b8",background:"#0f172a",borderBottom:"2px solid #1e293b",whiteSpace:"nowrap"};
  const tdS={padding:"7px 10px",fontSize:11,color:"#334155",verticalAlign:"middle",borderBottom:"1px solid #f1f5f9"};

  return (
    <div>
      {/* Summary cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:12,marginBottom:20}}>
        {[{label:"Total Tasks",val:data.length,color:"#0f172a"},
          {label:"Complete",val:complete,color:"#166534"},
          {label:"In Progress",val:inProgress,color:"#1e40af"},
          {label:"Planned",val:planned,color:"#475569"},
          {label:"Avg Progress",val:avgPct+"%",color:"#0891b2"}].map(c=>(
          <div key={c.label} style={{background:"#fff",borderRadius:10,padding:"12px 14px",
            border:"1px solid #e2e8f0",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
            <div style={{fontSize:22,fontWeight:800,color:c.color,marginBottom:2}}>{c.val}</div>
            <div style={{fontSize:10,color:c.color,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8}}>{c.label}</div>
          </div>
        ))}
      </div>

      {/* Controls */}
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}} className="no-print">
        <div style={{display:"flex",gap:4}}>
          {["gantt","table"].map(m=>(
            <button key={m} onClick={()=>setViewMode(m)}
              style={{padding:"5px 12px",borderRadius:20,border:"none",fontSize:11,fontWeight:600,
                cursor:"pointer",background:viewMode===m?"#0f172a":"#e2e8f0",
                color:viewMode===m?"#fff":"#475569",textTransform:"capitalize"}}>
              {m==="gantt"?"Gantt View":"Table View"}
            </button>
          ))}
        </div>
        {viewMode==="gantt" && (
          <button onClick={()=>setShowDeps(d=>!d)}
            style={{padding:"5px 12px",borderRadius:20,border:"1px solid #e2e8f0",fontSize:11,
              fontWeight:600,cursor:"pointer",background:showDeps?"#0f172a":"#fff",
              color:showDeps?"#fff":"#475569"}}>
            {showDeps?"Hide Deps":"Show Deps"}
          </button>
        )}
        <select value={filterWS} onChange={e=>setFilterWS(e.target.value)}
          style={{padding:"5px 10px",borderRadius:8,border:"1px solid #e2e8f0",fontSize:11,background:"#fff"}}>
          <option>All</option>
          {workstreams.map(w=><option key={w}>{w}</option>)}
        </select>
        <select value={filterMS} onChange={e=>setFilterMS(e.target.value)}
          style={{padding:"5px 10px",borderRadius:8,border:"1px solid #e2e8f0",fontSize:11,background:"#fff"}}>
          <option>All</option>
          {milestones.map(m=><option key={m}>{m}</option>)}
        </select>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <button onClick={exportCSV}
            style={{padding:"6px 12px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",
              color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>Export CSV</button>
          <label style={{padding:"6px 12px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",
            color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>
            Upload Excel
            <input ref={uploadRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleUpload} style={{display:"none"}}/>
          </label>
          {editMode && (
            <button onClick={addRow}
              style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#0f172a",
                color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}}>+ Add Task</button>
          )}
        </div>
      </div>

      {viewMode==="gantt" ? (
        <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",
          overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
          <div style={{overflowX:"auto"}}>
            <div style={{minWidth:1000}} ref={ganttRef}>
              {/* Column headers */}
              <div style={{display:"grid",gridTemplateColumns:"220px 130px 1fr",background:"#0f172a",gap:0}}>
                <div style={{padding:"10px 12px",fontSize:10,fontWeight:700,color:"#94a3b8",
                  letterSpacing:1.5,textTransform:"uppercase",borderRight:"1px solid #1e293b"}}>Task</div>
                <div style={{padding:"10px 12px",fontSize:10,fontWeight:700,color:"#94a3b8",
                  letterSpacing:1.5,textTransform:"uppercase",borderRight:"1px solid #1e293b"}}>Workstream</div>
                <div style={{position:"relative",overflow:"hidden"}}>
                  {(()=>{
                    const months=[];
                    const cur=new Date(minDate.getFullYear(),minDate.getMonth(),1);
                    const end=new Date(maxDate.getFullYear(),maxDate.getMonth()+1,1);
                    while(cur<end){
                      const mStart=new Date(cur);
                      const leftPct=Math.max(0,((mStart-minDate)/86400000/totalDays)*100);
                      const mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,1);
                      const widthPct=((Math.min(mEnd,maxDate)-Math.max(mStart,minDate))/86400000/totalDays)*100;
                      const isGoLive=cur.getMonth()===9&&cur.getFullYear()===2026;
                      months.push({label:cur.toLocaleDateString("en-AU",{month:"short",year:"2-digit"}),left:leftPct,width:widthPct,isGoLive});
                      cur.setMonth(cur.getMonth()+1);
                    }
                    return months.map((m,i)=>(
                      <div key={i} style={{position:"absolute",left:`${m.left}%`,width:`${m.width}%`,
                        top:0,bottom:0,borderLeft:"1px solid #334155",display:"flex",
                        alignItems:"center",paddingLeft:4,
                        background:m.isGoLive?"#1a2744":"transparent"}}>
                        <span style={{fontSize:9,fontWeight:700,
                          color:m.isGoLive?"#93c5fd":"#64748b",whiteSpace:"nowrap",letterSpacing:0.5}}>
                          {m.label}
                        </span>
                      </div>
                    ));
                  })()}
                  <div style={{height:36}}/>
                </div>
              </div>

              {/* Gantt body with SVG overlay */}
              {(()=>{
                const todayPct=Math.max(0,Math.min(100,((new Date()-minDate)/86400000/totalDays)*100));
                const ROW_H=34;
                const HDR_H=28;
                const TASK_COL=220;
                const WS_COL=130;

                // Build flat ordered list of visible rows with y positions
                let rowIndex=0;
                const rowPositions={};
                const sections=[];
                milestones.filter(m=>filterMS==="All"||m===filterMS).forEach(ms=>{
                  const msRows=visible.filter(r=>r.milestone===ms);
                  if(!msRows.length) return;
                  const sectionY=rowIndex*ROW_H+sections.length*HDR_H;
                  sections.push({ms,rows:msRows,sectionY});
                  msRows.forEach((r,i)=>{
                    rowPositions[r.id]={y:sectionY+HDR_H+i*ROW_H+ROW_H/2};
                    rowIndex++;
                  });
                });

                const totalH=rowIndex*ROW_H+sections.length*HDR_H;

                // Build dependency arrows
                const arrows=[];
                if(showDeps){
                  visible.forEach(r=>{
                    (r.deps||[]).forEach(depId=>{
                      const dep=data.find(d=>d.id===depId);
                      if(!dep||!rowPositions[r.id]||!rowPositions[depId]) return;
                      const fromY=rowPositions[depId].y;
                      const toY=rowPositions[r.id].y;
                      const fromX=TASK_COL+WS_COL+datePct(dep.finish)/100*100; // approximate
                      const toX=TASK_COL+WS_COL+datePct(r.start)/100*100;
                      const depStatus=dep.status;
                      const color=depStatus==="Complete"?"#22c55e":depStatus==="In Progress"?"#f59e0b":"#f43f5e";
                      arrows.push({fromX,fromY,toX,toY,color,fromId:depId,toId:r.id,depStatus});
                    });
                  });
                }

                return (
                  <div style={{position:"relative"}}>
                    {/* SVG arrow overlay */}
                    {showDeps&&arrows.length>0&&(
                      <svg style={{position:"absolute",top:0,left:0,width:"100%",height:totalH,
                        pointerEvents:"none",zIndex:5,overflow:"visible"}}>
                        <defs>
                          {["#22c55e","#f59e0b","#f43f5e"].map(c=>(
                            <marker key={c} id={"arr"+c.slice(1)} markerWidth="6" markerHeight="6"
                              refX="5" refY="3" orient="auto">
                              <path d="M0,0 L0,6 L6,3 z" fill={c}/>
                            </marker>
                          ))}
                        </defs>
                        {arrows.map((a,i)=>{
                          // Draw an elbow path: right from finish, down/up to target row, right to start
                          const x1=`${((TASK_COL+WS_COL)/10+datePct(data.find(d=>d.id===a.fromId)?.finish||""))}%`;
                          const x2=`${((TASK_COL+WS_COL)/10+datePct(data.find(d=>d.id===a.toId)?.start||""))}%`;
                          const isHighlight=highlightId&&(a.fromId===highlightId||a.toId===highlightId);
                          return (
                            <line key={i}
                              x1={x1} y1={a.fromY}
                              x2={x2} y2={a.toY}
                              stroke={a.color}
                              strokeWidth={isHighlight?2.5:1.5}
                              strokeOpacity={isHighlight?1:0.5}
                              strokeDasharray={a.depStatus==="Planned"?"4,3":"none"}
                              markerEnd={"url(#arr"+a.color.slice(1)+")"}
                            />
                          );
                        })}
                      </svg>
                    )}

                    {sections.map(({ms,rows})=>(
                      <div key={ms}>
                        <div style={{display:"grid",gridTemplateColumns:"220px 130px 1fr",background:"#1e293b"}}>
                          <div style={{padding:"5px 12px",fontSize:11,fontWeight:700,color:"#94a3b8",
                            gridColumn:"1/3",borderRight:"1px solid #334155"}}>{ms}</div>
                          <div style={{padding:"5px 0"}}/>
                        </div>
                        {rows.map((r,i)=>{
                          const wsColor=wsColors[r.workstream]||"#374151";
                          const left=datePct(r.start);
                          const width=durationPct(r.start,r.finish);
                          const myDeps=r.deps||[];
                          const isHighlighted=highlightId===r.id;
                          const isDepOf=highlightId&&myDeps.includes(highlightId);
                          const hasDepsOnMe=highlightId&&(data.find(d=>d.id===highlightId)?.deps||[]).includes(r.id);
                          let rowBg=i%2===0?"#fff":"#f8fafc";
                          if(isHighlighted) rowBg="#eff6ff";
                          if(isDepOf) rowBg="#f0fdf4";
                          if(hasDepsOnMe) rowBg="#fff7ed";
                          return (
                            <div key={r.id}
                              id={"gantt-row-"+r.id}
                              style={{display:"grid",gridTemplateColumns:"220px 130px 1fr",gap:0,
                                borderBottom:"1px solid #f1f5f9",background:rowBg,
                                alignItems:"center",minHeight:ROW_H,
                                cursor:editMode?"grab":"pointer",
                                outline:isHighlighted?"2px solid #3b82f6":"none",
                                outlineOffset:-1}}
                              onClick={()=>setHighlightId(id=>id===r.id?null:r.id)}
                              {...dragHandlers(data.indexOf(r))}>
                              <div style={{fontSize:11,color:"#0f172a",lineHeight:1.4,
                                padding:"6px 10px 6px 12px",borderRight:"1px solid #f1f5f9",
                                display:"flex",alignItems:"flex-start",gap:6}}>
                                {editMode&&(
                                  <div style={{display:"flex",flexDirection:"column",gap:1,flexShrink:0,marginTop:1}}>
                                    <span style={{color:"#94a3b8",fontSize:11,cursor:"grab"}} title="Drag">⠿</span>
                                    <button onClick={e=>{e.stopPropagation();moveRow(data.indexOf(r),-1);}}
                                      style={{fontSize:8,padding:"1px 3px",border:"1px solid #e2e8f0",borderRadius:2,background:"#f8fafc",cursor:"pointer",color:"#64748b",lineHeight:1}}>▲</button>
                                    <button onClick={e=>{e.stopPropagation();moveRow(data.indexOf(r),1);}}
                                      style={{fontSize:8,padding:"1px 3px",border:"1px solid #e2e8f0",borderRadius:2,background:"#f8fafc",cursor:"pointer",color:"#64748b",lineHeight:1}}>▼</button>
                                  </div>
                                )}
                                <div style={{flex:1}}>
                                  {editMode
                                    ? <input value={r.task} onChange={e=>update(r.id,"task",e.target.value)}
                                        onClick={e=>e.stopPropagation()}
                                        style={{width:"100%",fontSize:11,fontFamily:"inherit",
                                          border:"1px solid #6366f1",borderRadius:3,padding:"2px 4px"}}/>
                                    : <span>{r.task}</span>}
                                  {myDeps.length>0&&(
                                    <div style={{fontSize:9,color:"#64748b",marginTop:2}}>
                                      {myDeps.length} dep{myDeps.length>1?"s":""}
                                    </div>
                                  )}
                                </div>
                                {editMode&&(
                                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                                    <button onClick={e=>{e.stopPropagation();setDepTask(r);}}
                                      title="Manage dependencies"
                                      style={{fontSize:10,padding:"2px 6px",borderRadius:4,
                                        border:"1px solid #e2e8f0",background:"#f8fafc",
                                        cursor:"pointer",color:"#475569",whiteSpace:"nowrap"}}>
                                      ⛓ Deps
                                    </button>
                                    <button onClick={e=>{e.stopPropagation();delRow(r.id);}}
                                      style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontSize:13}}>✕</button>
                                  </div>

                              <div style={{position:"relative",height:ROW_H}}>
                                {(()=>{
                                  const lines=[];
                                  const cur2=new Date(minDate.getFullYear(),minDate.getMonth(),1);

                                  while(cur2<end2){
                                    const p=((cur2-minDate)/86400000/totalDays)*100;
                                    if(p>0&&p<100) lines.push(p);
                                    cur2.setMonth(cur2.getMonth()+1);
                                  }
                                  return lines.map((p,li)=>(
                                    <div key={li} style={{position:"absolute",left:`${p}%`,top:0,
                                      bottom:0,width:1,background:"#f1f5f9",zIndex:0}}/>

                                  </span>
                                </div>

                            </div>
                          );
                        })}

function CategoryPill({category}) {
  const c = TECHSPEC_CAT_C[category] || "#374151";
  return <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:12,background:c+"18",color:c,border:`1px solid ${c}44`,whiteSpace:"nowrap"}}>{category}</span>;
}

function YesNoPill({value}) {
  const yes = value === "Yes";
  const c = yes ? "#16a34a" : "#64748b";
  return <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:12,background:c+"18",color:c,border:`1px solid ${c}44`,whiteSpace:"nowrap"}}>{value || "No"}</span>;
}

function nextReqId(rows) {
  const nums = rows.map(r => { const m = /(\d+)\s*$/.exec(r.reqId||""); return m ? parseInt(m[1],10) : 0; });
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return "REQ-" + String(next).padStart(3,"0");
}

// ── Technical Spec / Requirements ───────────────────────────────────────────
function TechSpecTab({data, setData, editMode}) {
  const [filterCat, setFilterCat] = useState("All");
  const [filterStatus, setFilterStatus] = useState("All");
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const dragHandlers = useDraggableRows(data, setData, editMode);

  function update(id, field, val) { setData(prev => prev.map(r => r.id === id ? {...r, [field]:val} : r)); }
  function addRow() {
    setData(prev => [...prev, {id:mkId(), reqId:nextReqId(prev), category:TECHSPEC_CATEGORIES[0],
      description:"", acceptance:"", dependencies:"", owner:"", status:"Open", evidence:""}]);
  }
  function delRow(id) { setData(prev => prev.filter(r => r.id !== id)); }
  function toggleSort(col) { if (sortCol===col) setSortDir(d=>-d); else { setSortCol(col); setSortDir(1); } }
  function moveRow(idx, dir) {
    setData(prev => {
      const next = [...prev];
      const target = idx + dir;
      if (target < 0 || target >= next.length) return next;
      [next[idx], next[target]] = [next[target], next[idx]];
      return next;
    });
  }

  const counts = {
    total: data.length,
    open: data.filter(r=>r.status==="Open").length,
    inProgress: data.filter(r=>r.status==="In Progress").length,
    complete: data.filter(r=>r.status==="Complete").length,
  };

  const cards = [
    {key:"All",  label:"Total",       val:counts.total,      color:"#0f172a", bg:"#f8fafc", border:"#e2e8f0"},
    {key:"Open", label:"Open",        val:counts.open,       color:STATUS_C.Open.text,        bg:STATUS_C.Open.bg,        border:"#fda4af"},
    {key:"In Progress", label:"In Progress", val:counts.inProgress, color:STATUS_C["In Progress"].text, bg:STATUS_C["In Progress"].bg, border:"#93c5fd"},
    {key:"Complete", label:"Complete", val:counts.complete,  color:STATUS_C.Complete.text,    bg:STATUS_C.Complete.bg,    border:"#86efac"},
  ];

  let visible = [...data];
  if (filterCat !== "All") visible = visible.filter(r => r.category === filterCat);
  if (filterStatus !== "All") visible = visible.filter(r => r.status === filterStatus);
  if (sortCol) visible.sort((a,b) => (a[sortCol]||"").localeCompare(b[sortCol]||"")*sortDir);

  const thS = {padding:"9px 10px",textAlign:"left",fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#94a3b8",background:"#0f172a",whiteSpace:"nowrap",borderBottom:"2px solid #1e293b",cursor:"pointer",userSelect:"none"};
  const tdS = {padding:"9px 10px",fontSize:12,color:"#334155",verticalAlign:"top",borderBottom:"1px solid #f1f5f9"};
  const SI = ({col}) => <span style={{marginLeft:3,opacity:sortCol===col?1:0.3}}>{sortCol===col&&sortDir===-1?"↑":"↓"}</span>;

  return (
    <div>
      {/* Clickable status filter cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {cards.map(c => {
          const active = filterStatus === c.key;
          return (
            <div key={c.key} onClick={() => setFilterStatus(active ? "All" : c.key)}
              style={{background:active?c.color:c.bg,borderRadius:10,padding:"14px 16px",
                border:`2px solid ${active?c.color:c.border}`,
                boxShadow:active?"0 4px 16px rgba(0,0,0,0.15)":"0 1px 4px rgba(0,0,0,0.04)",
                cursor:"pointer",transition:"all 0.15s",userSelect:"none"}} className="pcard">
              <div style={{fontSize:24,fontWeight:800,color:active?"#fff":c.color,marginBottom:2}}>{c.val}</div>
              <div style={{fontSize:11,color:active?"rgba(255,255,255,0.8)":c.color,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8}}>{c.label}</div>
              {active && <div style={{fontSize:9,color:"rgba(255,255,255,0.6)",marginTop:2}}>click to clear</div>}
            </div>
          );
        })}
      </div>

      {/* Secondary filters + controls */}
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}} className="no-print">
        <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{padding:"5px 10px",borderRadius:8,border:"1px solid #e2e8f0",fontSize:11,background:"#fff"}}>
          <option>All</option>
          {TECHSPEC_CATEGORIES.map(o=><option key={o}>{o}</option>)}
        </select>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <button onClick={() => downloadCSV("technical-spec.csv",toCSV(data,["reqId","category","description","acceptance","dependencies","owner","status","evidence"]))}
            style={{padding:"6px 12px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>Export CSV</button>
          {editMode && <button onClick={addRow} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#0f172a",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}}>+ Add Requirement</button>}
        </div>
      </div>

      {/* Table */}
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",border:"1px solid #e2e8f0"}} className="pcard">
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:1080}}>
            <thead>
              <tr>
                {editMode && <th style={{...thS,width:70}}>Order</th>}
                <th style={{...thS,width:90}} onClick={()=>toggleSort("reqId")}>Req ID <SI col="reqId"/></th>
                <th style={{...thS,width:110}} onClick={()=>toggleSort("category")}>Category <SI col="category"/></th>
                <th style={thS}>Description</th>
                <th style={thS}>Acceptance Criteria</th>
                <th style={{...thS,width:150}}>System Dependencies</th>
                <th style={{...thS,width:115}}>Owner</th>
                <th style={{...thS,width:110}} onClick={()=>toggleSort("status")}>Status <SI col="status"/></th>
                <th style={{...thS,width:140}}>Test Evidence</th>
                {editMode && <th style={{...thS,width:36}}/>}
              </tr>
            </thead>
            <tbody>
              {visible.map((r, i) => (
                <tr key={r.id} style={{background:i%2===0?"#fff":"#f8fafc",cursor:editMode?"grab":"default"}} {...dragHandlers(i)}>
                  {editMode && (
                    <td style={{...tdS,textAlign:"center"}}>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                        <span style={{color:"#94a3b8",fontSize:14,cursor:"grab",userSelect:"none"}} title="Drag to reorder">⠿</span>
                        <button onClick={()=>moveRow(i,-1)} disabled={i===0} style={{fontSize:10,lineHeight:1,padding:"1px 4px",border:"1px solid #e2e8f0",borderRadius:3,background:"#f8fafc",cursor:"pointer",color:"#64748b"}}>▲</button>
                        <button onClick={()=>moveRow(i,1)} disabled={i===visible.length-1} style={{fontSize:10,lineHeight:1,padding:"1px 4px",border:"1px solid #e2e8f0",borderRadius:3,background:"#f8fafc",cursor:"pointer",color:"#64748b"}}>▼</button>
                      </div>
                    </td>
                  )}
                  <td style={{...tdS,fontWeight:700,color:"#0f172a",whiteSpace:"nowrap"}}>{editMode ? <InlineEdit value={r.reqId} onChange={v=>update(r.id,"reqId",v)}/> : r.reqId}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.category} onChange={v=>update(r.id,"category",v)} options={TECHSPEC_CATEGORIES}/> : <CategoryPill category={r.category}/>}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.description} onChange={v=>update(r.id,"description",v)} multiline/> : <span style={{lineHeight:1.5}}>{r.description}</span>}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.acceptance} onChange={v=>update(r.id,"acceptance",v)} multiline/> : <span style={{lineHeight:1.5,color:"#166534"}}>{r.acceptance}</span>}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.dependencies} onChange={v=>update(r.id,"dependencies",v)} multiline/> : <span style={{lineHeight:1.5}}>{r.dependencies}</span>}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.owner} onChange={v=>update(r.id,"owner",v)}/> : r.owner}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.status} onChange={v=>update(r.id,"status",v)} options={["Open","Planned","In Progress","Under Review","Complete"]}/> : <StatusBadge status={r.status}/>}</td>
                  <td style={tdS}>{editMode ? <InlineEdit value={r.evidence} onChange={v=>update(r.id,"evidence",v)} multiline/> : <span style={{lineHeight:1.5,color:"#64748b"}}>{r.evidence || <span style={{fontStyle:"italic",color:"#94a3b8"}}>No evidence linked</span>}</span>}</td>
                  {editMode && <td style={{...tdS,textAlign:"center"}}>
                    <button onClick={()=>delRow(r.id)} style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontSize:14}}>✕</button>
                  </td>}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{marginTop:12,fontSize:11,color:"#94a3b8"}}>
        {data.length} requirement{data.length!==1?"s":""} tracked · {counts.complete} verified with evidence-backed sign-off
      </div>
    </div>
  );
}

              color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>Export CSV</button>

          )}

      {data.map((s, i) => (
        <div key={s.id} {...dragHandlers(i)}
          style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",
            boxShadow:"0 2px 8px rgba(0,0,0,0.04)",marginBottom:14,overflow:"hidden"}}>

            background:"#0f172a",cursor:editMode?"grab":"default"}}>

            {editMode && (
              <>
                <button onClick={()=>moveSection(i,-1)} disabled={i===0}
                  style={{fontSize:10,padding:"2px 6px",border:"1px solid #334155",borderRadius:3,background:"#1e293b",cursor:"pointer",color:"#94a3b8"}}>▲</button>
                <button onClick={()=>moveSection(i,1)} disabled={i===data.length-1}
                  style={{fontSize:10,padding:"2px 6px",border:"1px solid #334155",borderRadius:3,background:"#1e293b",cursor:"pointer",color:"#94a3b8"}}>▼</button>
                <button onClick={()=>delSection(s.id)}
                  style={{color:"#f87171",background:"none",border:"none",cursor:"pointer",fontSize:14}}>✕</button>
              </>
            )}
          </div>
          <div style={{padding:"14px 16px"}}>
            {editMode
              ? <textarea value={s.content} onChange={e=>update(s.id,"content",e.target.value)}
                  placeholder="Describe this section..."
                  style={{width:"100%",minHeight:100,fontSize:12,fontFamily:"inherit",color:"#334155",
                    border:"1px solid #6366f1",borderRadius:6,padding:"8px 10px",resize:"vertical",lineHeight:1.6}}/>
              : <p style={{fontSize:12,color:"#334155",lineHeight:1.7,margin:0,whiteSpace:"pre-wrap"}}>
                  {s.content || <span style={{color:"#94a3b8",fontStyle:"italic"}}>Not yet populated.</span>}
                </p>}
          </div>
        </div>
      ))}

      {data.length === 0 && (
        <div style={{textAlign:"center",padding:"40px 20px",color:"#94a3b8",fontSize:13,
          background:"#fff",borderRadius:12,border:"1px dashed #e2e8f0"}}>
          No sections yet. {editMode ? "Click “+ Add Section” to start." : "Switch to Edit Mode to add sections."}
        </div>
      )}

      <div style={{marginTop:4,fontSize:11,color:"#94a3b8"}}>
        {filledCount} of {data.length} sections populated · drag ⠿ to reorder in Edit Mode
      </div>
    </div>
  );
}

// ── Business Readiness ──────────────────────────────────────────────────────
const BR_CHECKLIST_STATUSES = ["To Do","In Progress","Complete","Not Applicable"];
const BR_IMPACTED_OPTIONS = ["Yes","No"];
const BR_DEFECT_PRIORITIES = ["High","Medium","Low"];
const BR_DEFECT_STATUSES = ["Open","Monitor","Pending Retest","Closed"];

function BRPriorityBadge({priority}) {
  const c = priority==="High" ? {bg:"#fee2e2",text:"#991b1b"} : priority==="Medium" ? {bg:"#fef3c7",text:"#92400e"} : {bg:"#f1f5f9",text:"#475569"};
  return <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:4,background:c.bg,color:c.text,textTransform:"uppercase",letterSpacing:0.5}}>{priority||"Low"}</span>;
}

// Shared register for the checklist-style sections: Go-Live & Approvals,
// PIV & Prerequisites, Tech Setup, UAT — same add/edit/delete/reorder/CSV
// shape, just a different column set per section.
function BRChecklistTab({data, setData, editMode, columns, grouped, csvName, itemLabel}) {
  const dragHandlers = useDraggableRows(data, setData, editMode);
  function update(id, field, val) { setData(prev => prev.map(r => r.id===id ? {...r,[field]:val} : r)); }
  function addRow(group) {
    const blank = {id:mkId(), status:"To Do"};
    columns.forEach(c => { if (c.key!=="status") blank[c.key] = ""; });
    if (grouped) blank.group = group;
    setData(prev => [...prev, blank]);
  }
  function delRow(id) { setData(prev => prev.filter(r => r.id !== id)); }

  const thS = {padding:"9px 10px",textAlign:"left",fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#94a3b8",background:"#0f172a",whiteSpace:"nowrap",borderBottom:"2px solid #1e293b"};
  const tdS = {padding:"9px 10px",fontSize:12,color:"#334155",verticalAlign:"top",borderBottom:"1px solid #f1f5f9"};

  const groups = grouped ? [...new Set(data.map(r=>r.group))] : [null];

  function renderTable(rows, groupKey) {
    return (
      <div className="pcard" style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:16}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr>
                {editMode && <th style={{...thS,width:60}}>Order</th>}
                {columns.map(c => <th key={c.key} style={{...thS,width:c.width}}>{c.label}</th>)}
                <th style={{...thS,width:120}}>Status</th>
                {editMode && <th style={{...thS,width:36}}/>}
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i) => (
                <tr key={r.id} style={{background:i%2===0?"#fff":"#f8fafc",cursor:editMode?"grab":"default"}} {...dragHandlers(data.indexOf(r))}>
                  {editMode && (
                    <td style={{...tdS,textAlign:"center"}}>
                      <span style={{color:"#94a3b8",fontSize:14,cursor:"grab",userSelect:"none"}} title="Drag to reorder">⠿</span>
                    </td>
                  )}
                  {columns.map(c => (
                    <td key={c.key} style={tdS}>
                      {editMode
                        ? <InlineEdit value={r[c.key]} onChange={v=>update(r.id,c.key,v)} multiline={c.multiline}/>
                        : <span style={{lineHeight:1.5}}>{r[c.key] || <span style={{color:"#94a3b8",fontStyle:"italic"}}>Not yet recorded</span>}</span>}
                    </td>
                  ))}
                  <td style={tdS}>
                    {editMode
                      ? <InlineEdit value={r.status} onChange={v=>update(r.id,"status",v)} options={BR_CHECKLIST_STATUSES}/>
                      : <StatusBadge status={r.status}/>}
                  </td>
                  {editMode && (
                    <td style={{...tdS,textAlign:"center"}}>
                      <button onClick={()=>delRow(r.id)} style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontSize:14}}>✕</button>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {editMode && (
          <div style={{padding:"10px 14px",borderTop:"1px solid #f1f5f9"}}>
            <button onClick={()=>addRow(groupKey)} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#0f172a",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}}>+ Add {itemLabel}</button>
          </div>
        )}
      </div>
    );
  }

  const csvCols = grouped ? ["group",...columns.map(c=>c.key),"status"] : [...columns.map(c=>c.key),"status"];

  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}} className="no-print">
        <button onClick={() => downloadCSV(csvName, toCSV(data, csvCols))}
          style={{padding:"6px 12px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>Export CSV</button>
      </div>
      {groups.map(g => (
        <div key={g||"_all"}>
          {grouped && <div style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#94a3b8",marginBottom:10}}>{g}</div>}
          {renderTable(data.filter(r=>!grouped||r.group===g), g)}
        </div>
      ))}
    </div>
  );
}

  );

// ── Summary: computed rollup with clickable stat cards ──────────────────────
function BRSummaryTab({impact, uat, defects, onNavigate}) {
  const total = impact.length;
  const impacted = impact.filter(r=>r.impacted==="Yes").length;
  const complete = impact.filter(r=>r.status==="Complete").length;
  const pct = total ? Math.round((complete/total)*100) : 0;

  const byStatus = {
    "To Do": impact.filter(r=>r.status==="To Do").length,
    "In Progress": impact.filter(r=>r.status==="In Progress").length,
    "Complete": complete,
    "Not Applicable": impact.filter(r=>r.status==="Not Applicable").length,
  };
  const statusColor = {"To Do":"#94a3b8","In Progress":"#3b82f6","Complete":"#22c55e","Not Applicable":"#cbd5e1"};

  const cards = [
    {label:"Total Items", val:total, color:"#0f172a", onClick:()=>onNavigate("impact",{impacted:"All",status:"All"})},

// ── Tab 7: FAQs ───────────────────────────────────────────────────────────────
function FAQsTab({data, setData, editMode}) {
  const [filterCat, setFilterCat] = useState("All");
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState({});

  function toggle(id) { setExpanded(prev => ({...prev, [id]: !prev[id]})); }
  function update(id, field, val) { setData(prev => prev.map(q => q.id===id ? {...q,[field]:val} : q)); }
  function addFaq() {
    const newId = "f" + Date.now();
    setData(prev => [...prev, {id:newId, category:filterCat==="All"?"Preparation":filterCat, question:"", answer:""}]);
    setExpanded(prev => ({...prev, [newId]: true}));
  }
  function delFaq(id) { setData(prev => prev.filter(q => q.id !== id)); }

  const visible = data.filter(q => {
    const catMatch = filterCat === "All" || q.category === filterCat;
    const srch = search.toLowerCase();
    const textMatch = !srch || q.question.toLowerCase().includes(srch) || q.answer.toLowerCase().includes(srch);
    return catMatch && textMatch;
  });

  const grouped = FAQ_CATEGORIES.filter(c => c !== "All").reduce((acc, cat) => {
    const items = visible.filter(q => q.category === cat);
    if (items.length) acc[cat] = items;
    return acc;
  }, {});

  const CAT_COLORS = {
    "Preparation":        {bg:"#dbeafe",text:"#1e40af",border:"#bfdbfe"},
    "Activation":         {bg:"#dcfce7",text:"#166534",border:"#bbf7d0"},
    "Fees and Payments":  {bg:"#fef3c7",text:"#92400e",border:"#fde68a"},
    "Security":           {bg:"#fee2e2",text:"#991b1b",border:"#fecaca"},
    "Managing Your Account":{bg:"#ede9fe",text:"#5b21b6",border:"#ddd6fe"},
  };

  return (
    <div>
      {/* Summary + controls */}
      <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{background:"#fff",borderRadius:10,padding:"12px 18px",
          border:"1px solid #e2e8f0",boxShadow:"0 1px 4px rgba(0,0,0,0.04)",flexShrink:0}}>
          <div style={{fontSize:22,fontWeight:800,color:"#0f172a"}}>{data.length}</div>
          <div style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:0.8}}>Total FAQs</div>
        </div>
        <input
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search questions and answers..."
          style={{flex:1,minWidth:200,padding:"9px 14px",borderRadius:8,border:"1px solid #e2e8f0",
            fontSize:12,outline:"none",fontFamily:"inherit"}}
        />
        <button onClick={() => downloadCSV("faqs.csv",toCSV(data,["category","question","answer"]))}
          style={{padding:"8px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",
            color:"#475569",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0}} className="no-print">
          Export CSV
        </button>
        {editMode && (
          <button onClick={addFaq}
            style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#0f172a",
              color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0}}>
            + Add FAQ
          </button>
        )}
      </div>

      {/* Category filter pills */}
      <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}} className="no-print">
        {FAQ_CATEGORIES.map(cat => {
          const cc = cat !== "All" ? CAT_COLORS[cat] : null;
          const active = filterCat === cat;
          return (
            <button key={cat} onClick={() => setFilterCat(cat)}
              style={{padding:"5px 14px",borderRadius:20,fontSize:11,fontWeight:600,
                cursor:"pointer",border:"1px solid",transition:"all 0.12s",
                borderColor: active ? (cc ? cc.border : "#0f172a") : "#e2e8f0",
                background: active ? (cc ? cc.bg : "#0f172a") : "#fff",
                color: active ? (cc ? cc.text : "#fff") : "#64748b"}}>
              {cat}
            </button>
          );
        })}
      </div>

      {/* FAQ groups */}
      {Object.keys(grouped).length === 0 && (
        <div style={{textAlign:"center",padding:"40px 20px",color:"#94a3b8",fontSize:13}}>
          No FAQs match your search.
        </div>
      )}

      {Object.entries(grouped).map(([cat, items]) => {
        const cc = CAT_COLORS[cat] || {bg:"#f8fafc",text:"#475569",border:"#e2e8f0"};
        return (
          <div key={cat} style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{fontSize:10,fontWeight:800,padding:"3px 10px",borderRadius:12,
                background:cc.bg,color:cc.text,border:`1px solid ${cc.border}`,
                textTransform:"uppercase",letterSpacing:1}}>
                {cat}
              </span>
              <span style={{fontSize:11,color:"#94a3b8"}}>{items.length} question{items.length!==1?"s":""}</span>
            </div>

            <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",
              overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
              {items.map((q, i) => {
                const isOpen = expanded[q.id];
                const isEmpty = !q.answer;
                return (
                  <div key={q.id} style={{borderBottom: i<items.length-1 ? "1px solid #f1f5f9" : "none"}}>
                    {/* Question row */}
                    <div
                      onClick={() => !editMode && toggle(q.id)}
                      style={{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 18px",
                        cursor:editMode?"default":"pointer",
                        background:isOpen?`${cc.bg}66`:"#fff",
                        transition:"background 0.12s"}}>
                      <div style={{width:20,height:20,borderRadius:"50%",
                        background:isOpen?cc.text:"#e2e8f0",flexShrink:0,marginTop:1,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        transition:"all 0.12s"}}>
                        <span style={{fontSize:10,color:isOpen?"#fff":"#94a3b8",fontWeight:700,lineHeight:1}}>
                          {isOpen?"−":"+"}
                        </span>
                      </div>
                      <div style={{flex:1}}>
                        {editMode
                          ? <textarea value={q.question}
                              onChange={e => update(q.id,"question",e.target.value)}
                              style={{width:"100%",fontSize:13,fontWeight:600,color:"#0f172a",

                                padding:"4px 6px",resize:"vertical",minHeight:36,lineHeight:1.5}}/>
                          : <span style={{fontSize:13,fontWeight:600,color:"#0f172a",lineHeight:1.5}}>
                              {q.question || <span style={{color:"#94a3b8",fontStyle:"italic"}}>No question set</span>}
                            </span>}
                        {isEmpty && !editMode && (
                          <span style={{marginLeft:8,fontSize:10,color:"#f59e0b",fontWeight:600}}>Answer pending</span>
                        )}
                      </div>
                      {editMode && (
                        <button onClick={e => {e.stopPropagation();delFaq(q.id);}}
                          style={{color:"#ef4444",background:"none",border:"none",
                            cursor:"pointer",fontSize:14,flexShrink:0}}>✕</button>
                      )}
                    </div>

                    {/* Answer */}
                    {(isOpen || editMode) && (
                      <div style={{padding:"0 18px 14px 50px",background:`${cc.bg}44`}}>
                        {editMode
                          ? <textarea value={q.answer}
                              onChange={e => update(q.id,"answer",e.target.value)}
                              placeholder="Enter answer..."
                              style={{width:"100%",fontSize:12,color:"#334155",
                                fontFamily:"inherit",border:"1px solid #6366f1",borderRadius:4,
                                padding:"6px 8px",resize:"vertical",minHeight:64,lineHeight:1.6}}/>
                          : <p style={{fontSize:12,color:"#334155",lineHeight:1.7,margin:0}}>
                              {q.answer || <span style={{color:"#94a3b8",fontStyle:"italic"}}>Answer to be confirmed.</span>}

                                padding:"3px 8px",background:"#fff",color:"#475569",cursor:"pointer"}}>
                              {FAQ_CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}
                            </select>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      <div style={{marginTop:12,fontSize:11,color:"#94a3b8"}}>
        Click any question to expand the answer. Use the category filters or search to find specific topics.
        {data.filter(q=>!q.answer).length > 0 &&
          <span style={{color:"#f59e0b",marginLeft:8,fontWeight:600}}>
            {data.filter(q=>!q.answer).length} answer{data.filter(q=>!q.answer).length!==1?"s":""} still pending.
          </span>}
      </div>
    </div>
  );
}

const DEFAULT_TAB_LABELS = ["Plan & Timeline","Risks & Mitigations","Communication Plans","Open Questions","FAQs","Technical Spec & Plan","Business Readiness"];

// Stable routing keys for each grouped tab's sub-sections — never shown to
// the user and never renamed. Only the looked-up label (in subTabLabels) is
// editable, so renaming a sub-tab can never break which content it shows.
const SUBTAB_KEYS = {
  planTimeline: ["timeline","gantt"],
  comms: ["timeline","journeys"],
  techSpecPlan: ["register","plan"],
  businessReadiness: ["summary","impact","golive","piv","techsetup","uat","defects"],
};
const DEFAULT_SUBTAB_LABELS = {
  planTimeline: {timeline:"Timeline", gantt:"Project Plan (Gantt)"},
  comms: {timeline:"Timeline", journeys:"Customer Journeys"},
  techSpecPlan: {register:"Requirements Register", plan:"Plan & Architecture"},
  businessReadiness: {summary:"Summary", impact:"Impact Assessment", golive:"Go-Live & Approvals", piv:"PIV & Prerequisites", techsetup:"Tech Setup", uat:"UAT", defects:"Defects"},
};

function SubTabPills({sections, active, onChange, renaming, onRename}) {
  return (

        <input key={s.key} value={s.label} onChange={e=>onRename(s.key, e.target.value)}
          style={{padding:"5px 12px",borderRadius:20,fontSize:11,fontWeight:600,fontFamily:"inherit",
            border:"1px solid #6366f1",background:active===s.key?"#0f172a":"#e2e8f0",
            color:active===s.key?"#fff":"#475569",width:Math.max(90,s.label.length*7+30)}}/>
      ) : (
        <button key={s.key} onClick={()=>onChange(s.key)}
          style={{padding:"5px 14px",borderRadius:20,border:"none",fontSize:11,fontWeight:600,
            cursor:"pointer",background:active===s.key?"#0f172a":"#e2e8f0",color:active===s.key?"#fff":"#475569"}}>
          {s.label}
        </button>
      ))}
    </div>
  );
}

// ── Presentation View: a computed, print-friendly executive summary ────────
// Not a tab — reached via a header button. Every number here is derived
// from the same live state the rest of the app reads/writes, never
// hand-maintained.
const PRES_JOURNEY_COHORTS = ["c1","c2"]; // the only two cohorts with a real, distinct journey today

function daysUntil(dateStr) {
  // bannerGoLive uses full month names ("28 October 2026") while parseDate
  // expects the 3-letter abbreviations milestones/gantt dates use ("28 Oct
  // 2026") — normalize the month token to 3 letters so both work here.
  if (!dateStr) return null;
  const parts = dateStr.trim().split(" ");
  if (parts.length < 3) return null;
  const normalized = [parts[0], parts[1].slice(0,3), parts[2]].join(" ");
  const d = parseDate(normalized);
  if (!d) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - today) / 86400000);
}

function PresentationView({risks, questions, milestones, bannerGoLive, comms, cohortDefs, brImpact}) {
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const daysToGoLive = daysUntil(bannerGoLive);

  const highRisks = risks.filter(r => r.level === "high");
  const highRisksOpen = highRisks.filter(r => r.status !== "Complete");
  const openQuestions = questions.filter(q => q.status === "open");

  const readinessTotal = brImpact.length;
  const readinessComplete = brImpact.filter(r => r.status === "Complete").length;
  const readinessPct = readinessTotal ? Math.round((readinessComplete/readinessTotal)*100) : 0;

  // Simple, adjustable RAG heuristic — honest by default rather than tuned to look good.
  let rag = {label:"On Track", bg:"#166534", chip:"#dcfce7", dot:"#22c55e"};
  if (highRisksOpen.length >= 3 || (daysToGoLive!==null && daysToGoLive<=14 && readinessPct<50)) {
    rag = {label:"At Risk", bg:"#7f1d1d", chip:"#fee2e2", dot:"#ef4444"};
  } else if (highRisksOpen.length >= 1 || openQuestions.length >= 5) {
    rag = {label:"On Track — Watch Items", bg:"#78350f", chip:"#fef3c7", dot:"#f59e0b"};
  }

  const topRisks = [...highRisksOpen, ...highRisks.filter(r=>r.status==="Complete")].slice(0,3);
  const topQuestions = openQuestions.slice(0,3);

  const statusColor = {"To Do":"#94a3b8","In Progress":"#3b82f6","Complete":"#22c55e","Not Applicable":"#cbd5e1"};
  const byStatus = brImpact.reduce((acc,r)=>{ acc[r.status]=(acc[r.status]||0)+1; return acc; }, {});

  function updateSubTabLabel(containerId, key, val) {
    setSubTabLabels(prev => ({...prev, [containerId]: {...prev[containerId], [key]: val}}));

    setTabLabels(prev => prev.map((t,i) => i===index ? val : t));
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        // Type-guarded, same as importJSON: a malformed/corrupted localStorage
        // value (e.g. left over from a bug, or manual tampering) should never
        // be able to crash the app on load — skip anything the wrong shape
        // rather than handing a Tab component data it can't render.
        const isArr = v => Array.isArray(v);
        const isObj = v => v && typeof v === "object" && !Array.isArray(v);
        const isStr = v => typeof v === "string";
        if (isArr(s.plan)) setPlan(s.plan);
        if (isArr(s.risks)) setRisks(s.risks);
        if (isObj(s.comms)) setComms(prev => ({...prev, ...s.comms}));
        if (isArr(s.milestones)) setMilestones(s.milestones);
        if (isStr(s.bannerGoLive)) setBannerGoLive(s.bannerGoLive);
        if (isArr(s.cohortDefs)) setCohortDefs(s.cohortDefs);
        if (s.orgName !== undefined && isStr(s.orgName)) setOrgName(s.orgName);
        if (isStr(s.dashTitle)) setDashTitle(s.dashTitle);
        if (isStr(s.bannerDeact)) setBannerDeact(s.bannerDeact);
        if (isStr(s.bannerNote)) setBannerNote(s.bannerNote);
        if (isArr(s.questions)) setQuestions(s.questions);
        if (isArr(s.gantt)) setGantt(s.gantt);

        if (isArr(s.faqs)) setFaqs(s.faqs);
        if (isArr(s.tabLabels)) setTabLabels(s.tabLabels);
        if (isObj(s.subTabLabels)) setSubTabLabels(prev => ({...prev, ...s.subTabLabels}));
      }
    } catch(_) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, techSpecs, techPlan, brImpact, brGoLive, brPiv, brTechSetup, brUat, brDefects, tabLabels, subTabLabels, keyDates}));
      setSaveStatus("saved");
      const t = setTimeout(() => setSaveStatus("idle"), 1800);
      return () => clearTimeout(t);

  }, [plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, techSpecs, techPlan, brImpact, brGoLive, brPiv, brTechSetup, brUat, brDefects, tabLabels, subTabLabels, keyDates, loaded]);

  function pushUndo(snapshot) {
    setUndoStack(prev => {
      const next = [{...snapshot}, ...prev];
      return next.slice(0, UNDO_LIMIT);
    });
  }
  function undoLast() {
    setUndoStack(prev => {
      if (prev.length === 0) return prev;
      const [top, ...rest] = prev;
      if (top.plan) setPlan(top.plan);
      if (top.risks) setRisks(top.risks);
      if (top.comms) setComms(top.comms);
      if (top.milestones) setMilestones(top.milestones);
      return rest;
    });
  }

    setEditSnapshot({plan, risks, comms, milestones, bannerGoLive, bannerDeact, bannerNote, orgName, dashTitle, cohortDefs, faqs, questions, gantt, techSpecs, techPlan, brImpact, brGoLive, brPiv, brTechSetup, brUat, brDefects, tabLabels, subTabLabels, keyDates});
    setUndoStack([]);
    setRenamingTabs(false);

    setShowDiscard(true);

  function saveAndExit() {

    setRenamingTabs(false);

    }
